# 各联赛的积分和排名规则（算赛前积分榜用，src/features/standings.py 读）。
#
# 每个联赛按赛季分成几段，每段写：
#   赛季            [开始年份, 结束年份]（赛季用开始年份：2022 = 2022/23）。9999 = 一直用到现在
#   胜 / 平         一场胜、平各得几分
#   同分            积分相同时依次比什么（从上往下，前一项分出高低就不看后面）。能用的项目：
#                     净胜球、进球、客场进球、胜场、
#                     相互战绩积分、相互战绩净胜球、相互战绩进球、相互战绩客场进球
#                   “相互战绩”= 只看同分这几队之间的比赛。
#                   规则用完还分不开（例如同分同净胜球同进球），按队名字母排，并在结果里标“没分开”。
#   相互战绩要踢完  是 = 同分几队之间的比赛全部踢完才比相互战绩，没踢完就跳过相互战绩各项（西甲、意甲、法甲的写法）
#   降级            直接降级几队（最后几名）
#   降级附加赛      降级区上面还有几队要踢降级附加赛（例如德甲第 16 名）。算“保级大战”时，这几个名次也算危险区
#   来源            依据（主要是英文维基百科每个赛季页面积分榜下面的 "Rules for classification"，以及表里的降级标记）
#
# 我们算不了、只能近似的（写在这里，报告里也列了）：
#   - 公平竞赛分（红黄牌）、附加赛、抽签：数据库里没有，规则用到这一步就当“没分开”。
#   - 英超 2019/20 起的相互战绩只在“决定冠军、降级、欧战资格”时才用；我们对所有名次都用。
#   - 法甲 2019/20 因疫情提前结束，最终按场均积分排名；我们只按积分排。
#   - 被事后改判的比分（例如判 0:3）：以数据库里的比分为准。
联赛:
  # ================= 英超 =================
  E0:
    规则:
      - {赛季: [1993, 1993], 胜: 3, 平: 1, 同分: [净胜球, 进球], 降级: 3,
         来源: "en.wikipedia.org/wiki/1993–94_FA_Premier_League：points, goal difference, goals scored；22 队，降 3 队"}
      - {赛季: [1994, 1994], 胜: 3, 平: 1, 同分: [净胜球, 进球], 降级: 4,
         来源: "1994–95_FA_Premier_League：22 队缩编到 20 队，这一季降 4 队"}
      - {赛季: [1995, 2018], 胜: 3, 平: 1, 同分: [净胜球, 进球], 降级: 3,
         来源: "各季 Premier League 页面：points, goal difference, goals scored, (play-off)"}
      - {赛季: [2019, 9999], 胜: 3, 平: 1, 同分: [净胜球, 进球, 相互战绩积分, 相互战绩客场进球], 降级: 3,
         来源: "2019–20_Premier_League 起：1) points 2) GD 3) goals scored 4.1) head-to-head points 4.2) head-to-head away goals 4.3) play-off（4.x 只用于冠军、降级、欧战名额）"}

