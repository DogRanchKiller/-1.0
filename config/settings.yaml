  round_points: true          # 每场加减的分 P 先四舍五入到整数再改评分（维基百科这样写）
  refit_days: 7               # 每 7 天一格：更新评分、重新拟合有序 logit
  grid_anchor: '2000-01-03'   # 格子从这一天（星期一 00:00 UTC）算起，往前往后每 7 天一格；固定，不管从哪年开始跑
