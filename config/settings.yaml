# 项目配置。路径都相对于项目文件夹，以后搬到云服务器只改这里。
# 密钥不写在这里，写在 config/secrets.yaml（不上传 GitHub，模板见 secrets.example.yaml）。

paths:
  raw: data/raw              # 原始文件（只增不改）
  database: data/football.db # 数据库
  logs: logs
  notes: 学习笔记
  reports: data/reports       # 程序生成的统计报告（从原始层算出来，能重新生成）
  football_data_columns: config/football_data_columns.yaml  # football-data 的数据字典
  teams: config/teams.yaml   # 球队对照表
  team_aliases_wikipedia: config/team_aliases_wikipedia.yaml  # 维基百科条目名 → teams.yaml 的球队
  bookmakers_dongqiudi: config/bookmakers_dongqiudi.yaml  # 懂球帝的公司名（打了星号）→ 我们的公司名
  # 备份放在项目文件夹外面：项目文件夹被误删时备份还在。硬盘坏了会一起丢（见需求文档第 13 节）
  backup: D:/足球预测系统_备份

backup:
  keep_days: 30              # 数据库备份保留最近多少天

time:
  storage_timezone: UTC          # 内部统一用标准时间
  display_timezone: Asia/Shanghai # 网页显示北京时间

# 赛季用途（需求文档第 5、17 节）。赛季写成开始年份：2023 表示 2023/24
seasons:
  dev_last: 2023             # 开发赛季：2023/24 及以前
  exam: [2024, 2025]         # 期末考试赛季：2024/25、2025/26
  live_first: 2026           # 上线后：2026/27 起

leagues:                     # 第一阶段的联赛（football-data 的联赛代码）
  top: {E0: 英超, SP1: 西甲, D1: 德甲, I1: 意甲, F1: 法甲}
  second: {E1: 英冠, SP2: 西乙, D2: 德乙, I2: 意乙, F2: 法乙}

football_data:
  timezone: Europe/London    # football-data 的开球时间是英国当地时间（已核对，见需求文档 6.1）

scrape:
  min_interval_seconds: 5    # 同一网站两次请求之间至少隔几秒（低频访问）

# 懂球帝（赔率来源，需求文档 6.2）。采集程序 src/collect/dongqiudi.py，只存原始层，暂不进数据库
dongqiudi:
  min_interval_seconds: 5    # 两次请求至少隔几秒
  # 懂球帝自己的联赛编号（从它的网页上查到的）。乙级联赛的编号还没找到，暂时只采五大联赛
  league_ids: {E0: 4, SP1: 3, D1: 5, I1: 9, F1: 12}
  # 赛程接口一次返回约 40~50 场；“即将开赛”模式往回看几天（补抓刚踢完比赛的最终赔率）、往后看几天
  upcoming_lookback_days: 3
  upcoming_ahead_days: 8
  max_fixture_pages: 4       # 每个联赛每次最多翻几页赛程（防止翻页出错时一直请求）
  fixtures_every_hours: 6    # 每个联赛的赛程每隔几小时才重新抓一次
  # 赛前赔率快照的间隔：离开球越近抓得越勤。[离开球不到几小时, 至少隔几小时抓一次]，从近到远排
  odds_snapshot_rules: [[6, 1], [48, 3], [192, 12]]
  final_after_hours: 3       # 开球后几小时，比赛算踢完，抓一次“最终赔率”（以后不再变）
  backfill_first_season: 2018  # 历史回补最早的赛季（2026-10-31 定：只补赔率比较全的 2018/19 起；试验时用的是 2010，见 6.2.1）
  probe_matches_per_season: 3  # 试验模式：每个赛季抽几场看有没有赔率
  # 导入数据库（src/clean/dongqiudi_import.py）：
  # 懂球帝“时间待定”（Uncertain）的比赛，开球时间是占位的（同一轮都写成同一个时间，常常是这一轮靠后的日子），
  # 所以日期往前挪几天，当作“这一轮从哪天开始”（date_precision = round），宁早勿晚，取数层就不会让赛前预测看到开球后的东西
  uncertain_back_days: 3

# 数据状态页 src/jobs/status_page.py（需求文档第 6.2、8 节）：超过这些界限就在网页上标出来，并弹窗提醒一次
status:
  hourly_stale_hours: 2      # 懂球帝每小时任务超过几小时没成功，算出错（关机、睡眠或程序坏了）
  max_failures_24h: 3        # 最近 24 小时失败超过几次算“注意”（偶尔一两次多半是网络抖动）
  backup_stale_hours: 30     # 最新备份超过几小时，算“注意”（每天 3:30 备份一次，留一点余地）

# 预测页预览版 src/predict/preview.py + src/web/preview_page.py（需求文档第 8 节“早期简易页”，2026-10-31 提前到第 2 阶段）
preview:
  days_ahead: 7              # 显示未来几天开球的比赛
  leagues: top               # 哪一组联赛（leagues 段里的 top 五大联赛 / second 次级联赛）
  model: elo                 # 用哪个模型（models 段里的名字）。现在只有 Elo，页面上标“临时模型”
  # 模型和赔率的概率差多少算“差距大”，在页面上标出来。0.10 = 10 个百分点。
  # 这是先定的一个数，没有用数据验证过；以后用回测看“差距大的场次”模型到底对不对，再调
  gap_threshold: 0.10
  output: data/reports/preview.html   # 生成的网页（在 data/ 里，不上传 GitHub）

inventory:
  full_coverage: 0.9        # 覆盖表里，一个赛季有数据的比赛占多少以上算“有”

quality:                     # 数据质量检查的界限（需求文档第 16 节）；超出就列进质量报告
  min_odds: 1.01             # 赔率低于这个当作错误值，导入时不要
  max_handicap: 5            # 亚盘盘口绝对值超过这个当作错误值
  # 赔率倒数之和（含抽水）的正常范围。范围是 2026-10-30 按 football-data 189 万组赔率的实际分布定的：
  # 普通公司 99.9% 的数据都落在范围里，超出的多半是录错。
  overround:
    1x2: [1.0, 1.25]         # 普通公司 胜平负（三个倒数相加）
    2way: [1.0, 1.15]        # 普通公司 大小球、亚盘（两个倒数相加）
    exchange: [0.97, 1.10]   # 交易所：不是公司定价，是玩家互相挂单，抽水接近 0，冷门比赛挂单少时会偏离
    best: [0.85, 1.25]       # 多家最高：每个结果各挑一家最高的，倒数之和低于 1 很正常，低太多才是录错
  exchanges: [Betfair 交易所]
  best_of: [多家最高]

calc:                        # 纯计算工具（src/common/odds.py、settlement.py、markets.py，src/evaluate/metrics.py）
  devig_method: proportional # 默认去水方法：proportional 按比例（需求文档第 16 节）；第 3 阶段比较 shin、power
  solver_tol: 1.0e-12        # Shin 法、幂函数法解方程的精度（去水后概率之和与 1 的差距不超过这个）
  max_goals: 10              # 比分矩阵每队算到几球（需求文档第 3 节：内部算到每队 10 球）；超过的概率并进最后一行/列
  prob_sum_tol: 1.0e-6       # 概率加起来和 1 差多少以内算正常（比分矩阵、每场的胜平负概率）；差得更多说明算错了，报错
  logloss_eps: 1.0e-15       # log loss：概率低于这个按这个算，避免 log(0) = 负无穷（写成 1.0e-15，YAML 才认成数字）
  calibration_bins: 10       # 校准表分几个箱（0–10%、10–20%……）

features:                    # 取数层 src/features（需求文档第 16、17 节“不偷看未来”“数据用途”）
  data_usage: config/data_usage.yaml   # 数据用途字典：每类数据什么时候能知道、允许用在哪里
  current_stage: 2           # 现在做到第几阶段。数据用途字典里“模型输入从第几阶段起”和它比（角球黄牌 10、欧战比分 8）
  # 比分、统计开球后几个小时才算“能知道”：90 分钟 + 中场 15 分钟 + 补时，约 2 小时踢完，再留 1 小时给数据更新。
  # 要模拟“football-data 过几天才更新”的延迟（需求文档 6.2），把这个数调大再回测。
  result_available_after_kickoff_hours: 3
  # 赛前赔率开球前几个小时算“能知道”（按来源分）。football-data 实际是周五 / 周二下午采集的（开赛前约 1–3 天），
  # 按需求文档第 17 节第 3 步的约定，当作 T-24 版的赔率，所以写 24。没登记的来源一律拿不到。
  pre_odds_hours_before_kickoff:
    football-data: 24
  # 只有日期、没有开球时间的比赛，日期按哪个时区的“一天”算（football-data 的日期是英国当地日期）
  date_only_timezone: Europe/London
  # 只知道“这一轮从哪天开始”的杯赛（date_precision = round），按这一轮最长持续几天算最晚开球（比分晚知道，不偷看）
  round_date_window_days: 7
  # 同一场比赛有几个来源的比分统计时，按这个顺序挑第一个有的
  stats_source_priority: [football-data]

backtest:                    # 回测框架 src/evaluate/backtest.py（需求文档第 5 节“按时间滚动回测”“回测的计算量”）
  output_dir: data/backtest  # 回测结果放这里（data/ 不进 Git）；每次运行一个子文件夹
  horizons: [24, 6, 1]       # 预测时点：开球前几小时（T-24 / T-6 / T-1）
  refit_days: 7              # 参数每隔几天重新拟合一次（第 5 节：按周，不按每场）。Elo 评分本身每场赛后都更新，这里管的是“评分 → 概率”的换算参数
  eval_after_kickoff_hours: 72  # 打分时“站在”开球后几小时取本场比分和收盘赔率（比 features 的 3 小时缓冲、只有日期时的 27 小时都长）
  benchmark_bookmaker: 平博 Pinnacle  # 参考标杆：这家公司的收盘胜平负赔率按比例去水（第 5 节标杆 1）
  window_start_md: "06-15"   # 按赛季取预测目标时，日期窗口从这年的几月几日开始（再按 season 列筛，窗口只是为了少查）
  window_end_md: "07-01"     # 窗口到下一年的几月几日（2019/20 疫情延期的赛季按 season 列筛，不受影响）

compare:                     # 两个模型比较 src/evaluate/compare.py（第 5 节“怎么算真的更准”）
  n_boot: 2000               # bootstrap 重复抽样次数
  confidence: 0.95           # 可信区间的置信水平：95% 区间
  seed: 20261030             # 随机种子：同样的数据每次算出同样的区间
  block: week                # 按什么成块抽样：week 按周（同一周的比赛一起抽）/ day 按比赛日 / match 每场单独抽
  primary_metric: log_loss   # 下结论主要看哪个分数（另外两个也列出来）

models:                      # 第 0 步模型 src/models（需求文档第 4 节步骤 0）
  min_matches: 200           # 拟合窗口里少于这么多场就不出预测（数据太少，猜的成分太大）
  frequency:                 # 历史频率基线：按联赛的主胜 / 平 / 客胜比例
    window_days: 1095        # 只看截止前最近 3 年（约 3 个赛季）的比赛。主场优势在变（2020/21 空场降到 40.8%），太久远的不用
  frequency_poisson:         # 按联赛的场均进球 → 独立泊松比分矩阵
    window_days: 1095
  elo:
    initial: 1500            # 一个联赛第一个有数据的赛季，所有队都从这个分开始
    k: 20                    # 每场赛后评分最多变多少（K 值）
    home_advantage: 65       # 主场加多少分再算“预期得分”
    goal_diff: false         # true：净胜球越多评分变得越多（K 乘一个系数）
    season_regression: 0.33  # 新赛季开始时，留队的球队把评分往联赛平均拉回这么多（1/3）
    promoted_default: -100   # 升班马的初始分 = 联赛平均 + 这个数；有往年升班马的记录后，改用往年升班马的平均
    promoted_history_seasons: 5  # 往年升班马的平均水平看最近几个赛季
    burn_in_seasons: 2       # 每个联赛有数据的头几个赛季评分还没稳定，不用来拟合“评分 → 概率”
    logit_window_days: 1825  # “评分 → 概率”（有序 logit）用截止前最近 5 年的比赛拟合
  # 事先写下要试的 Elo 设置（第 5 节：先写下要试哪几种，不临时加）。上面是默认组；这里每组只写和默认不同的数
  elo_variants:
    elo_k30: {k: 30}
    elo_gd: {goal_diff: true}
    elo_reg50: {season_regression: 0.5}

# 维基百科：杯赛、欧战赛程（需求文档 6.1、第 18 节待定问题 5，你选了方案 a）
# robots.txt 不允许程序访问 /w/（包括 api.php）和 /api/（REST API），只欢迎“低速、友好”的程序看 /wiki/条目名 的页面。
# 所以下载程序只请求 https://en.wikipedia.org/wiki/条目名（不带问号参数），一次一个，间隔下面的秒数。
wikipedia:
  base_url: https://en.wikipedia.org/wiki/
  user_agent: "FootballLearningProject/0.1 (personal study; https://github.com/DogRanchKiller/-1.0) python-requests"
  min_interval_seconds: 3     # 两次请求之间至少隔几秒
  retry_waits: [30, 120, 600] # 失败（连不上 / 5xx）后等几秒再试；429 按网站给的 Retry-After 等
  first_season: 2000          # 最早下载哪个赛季（2000 = 2000/01）
  max_subpages: 15            # 一个赛事一个赛季最多跟进几个子页面（防止链接越跟越多）
  # 子页面：主页面里链接到“主页面标题 + 空格 + ……”的页面（例如 “2008–09 UEFA Cup group stage”）。
  # “……”部分（小写后）符合下面任何一条规则（正则表达式）的不跟进：决赛单场页（主页面里已经有）、名单、统计等
  skip_subpages: ['^final$', 'squads', 'statistics', 'broadcast', 'disciplinary', 'top ?scorers', 'preliminary rounds',
                  'women', 'frauen', 'féminine', 'water polo', 'serie c', 'serie d', 'lega pro', 'dilettanti']
  # 清洗时也按 skip_subpages 跳过这些页面（第一次下载时还没有女子、低级别赛事这几条规则，那时下载的页面留在原始层，但不导入）。
  # 法国杯第 7 轮以前是业余球队的地区赛（我们的球队从第 7、8 轮才参加），这些页面也不导入：
  import_skip_pages: ['coupe de france (qualifying rounds|preliminary round|[1-6](st|nd|rd|th) (round|through))']
  # 每个赛事：代码 → 名称、页面标题。标题里 {season} = “2008–09” 这种写法，{year} = 赛季开始年份。
  # 一个赛事可以有几种标题（改过名），按 [第一个赛季, 最后一个赛季, 标题] 写；同一赛季有几种就依次试。
  # 重赛: true = 平局要重赛（英足总杯）：同一轮同一对球队的第二场是重赛，不是第 2 回合。
  # 单场: true = 超级杯，一年一场（西班牙 2019/20 起是四队小赛会），赛季按比赛日期算。
  # skip_subpages_extra：这个赛事另外不跟进的子页面（规则写法同上。例如足总杯资格赛：几百场业余比赛，我们的球队不参加）
  competitions:
    UCL:  {名称: 欧冠, 国家: 欧洲, titles: [[2000, 2100, "{season} UEFA Champions League"]]}
    UEL:  {名称: 欧联（2008/09 以前叫联盟杯）, 国家: 欧洲,
           titles: [[2000, 2008, "{season} UEFA Cup"], [2009, 2100, "{season} UEFA Europa League"]]}
    UECL: {名称: 欧协联, 国家: 欧洲,
           titles: [[2021, 2023, "{season} UEFA Europa Conference League"], [2024, 2100, "{season} UEFA Conference League"]]}
    FAC:  {名称: 英足总杯, 国家: 英格兰, 重赛: true, titles: [[2000, 2100, "{season} FA Cup"]], skip_subpages_extra: [qualifying rounds]}
    ELC:  {名称: 英联赛杯, 国家: 英格兰,
           titles: [[2000, 2015, "{season} Football League Cup"], [2016, 2100, "{season} EFL Cup"]]}
    DFB:  {名称: 德国杯, 国家: 德国, titles: [[2000, 2100, "{season} DFB-Pokal"]]}
    CI:   {名称: 意大利杯, 国家: 意大利, titles: [[2000, 2100, "{season} Coppa Italia"]]}
    CDR:  {名称: 国王杯, 国家: 西班牙, titles: [[2000, 2100, "{season} Copa del Rey"]]}
    CDF:  {名称: 法国杯, 国家: 法国, titles: [[2000, 2100, "{season} Coupe de France"]]}
    CDL:  {名称: 法国联赛杯（2019/20 后停办）, 国家: 法国, titles: [[2000, 2019, "{season} Coupe de la Ligue"]]}
    # 超级杯：一年一场（西班牙 2019/20 起四队），页面标题用年份。赛季按比赛日期算（7 月起算新赛季）
    UESC: {单场: true, 名称: 欧洲超级杯, 国家: 欧洲, titles: [[2000, 2100, "{year} UEFA Super Cup"]]}
    ECS:  {单场: true, 名称: 英格兰社区盾杯, 国家: 英格兰, titles: [[2000, 2001, "{year} FA Charity Shield"], [2002, 2100, "{year} FA Community Shield"]]}
    DSC:  {单场: true, 名称: 德国超级杯, 国家: 德国, titles: [[2010, 2100, "{year} DFL-Supercup"]]}
    # 维基百科改过标题写法：意大利超级杯 2025 起用 “2025–26”；西班牙超级杯 2024/25 起用比赛那年（2025 年 1 月踢 → “2025”）。
    # {next_year} = 赛季开始年份 + 1
    ISC:  {单场: true, 名称: 意大利超级杯, 国家: 意大利, titles: [[2000, 2024, "{year} Supercoppa Italiana"], [2025, 2100, "{season} Supercoppa Italiana"]]}
    SSC:  {单场: true, 名称: 西班牙超级杯, 国家: 西班牙, titles: [[2000, 2018, "{year} Supercopa de España"], [2019, 2023, "{season} Supercopa de España"],
                                              [2024, 2100, "{next_year} Supercopa de España"]]}
    FSC:  {单场: true, 名称: 法国超级杯, 国家: 法国, titles: [[2000, 2100, "{year} Trophée des Champions"]]}

# 交叉核对用的两个开放数据集（只用来检查维基百科解析得对不对，不导入数据库）。
# 都在 GitHub 上（raw.githubusercontent.com 没有 robots.txt 限制）。文件不大，每个只下载一次。
#   engsoccerdata（GPL 许可，R 语言数据包）：英足总杯、英联赛杯、欧冠的历史比分
#   openfootball（CC0 公有领域）：欧冠 / 欧联 / 欧协联、各国杯赛，纯文本 Football.TXT 格式
crosscheck:
  user_agent: "FootballLearningProject/0.1 (personal study; https://github.com/DogRanchKiller/-1.0) python-requests"
  min_interval_seconds: 3
  retry_waits: [30, 120, 600]
  engsoccerdata:
    base_url: https://raw.githubusercontent.com/jalapic/engsoccerdata/master/data-raw/
    files: {UCL: champs.csv, FAC: facup.csv, ELC: leaguecup.csv}
  openfootball:
    base_url: https://raw.githubusercontent.com/openfootball/
    # 赛事代码 → [仓库, 文件名, 第一个赛季, 最后一个赛季]；网址 = base_url + 仓库/master/2018-19/文件名
    files:
      UCL:  [champions-league, cl.txt, 2011, 2025]
      UEL:  [champions-league, el.txt, 2020, 2024]
      UECL: [champions-league, conf.txt, 2021, 2024]
      FAC:  [england, facup.txt, 2018, 2024]
      ELC:  [england, eflcup.txt, 2018, 2024]
      DFB:  [deutschland, cup.txt, 2018, 2025]
      CDR:  [espana, cup.txt, 2020, 2024]
      CI:   [italy, cup.txt, 2020, 2024]

# ---------- 赛前积分榜和复盘自动标签（第 1 阶段，需求文档第 15 节“标签和备注”） ----------
standings:
  rules: config/league_rules.yaml           # 各联赛积分规则、同分排名规则、降级 / 争冠名额（每条写了来源）
  deductions: config/points_deductions.yaml # 扣分记录（football-data 没有扣分，手工录入，每条写来源）

labels:
  derbies: config/derbies.yaml   # 德比对阵名单
  output_dir: data/labels        # 算好的标签存在这里（data/ 不进 Git），每个联赛一个文件
  # 赛前积分榜按“开球前多少小时”截止。0 = 开球那一刻：只算开球前已经知道比分的比赛（复盘用）。
  # 以后要当模型特征，改成预测时点（24 / 6 / 1），和 T-24 / T-6 / T-1 一致。
  cutoff_hours_before_kickoff: 0
  race:                          # 争冠战 / 保级战（定义见 src/review/labels.py 开头）
    last_rounds: 10              # 只看赛季最后几轮：每队分开看，这场赛前它自己的剩余场次（含本场）≤ 这个数
    gap_points: 6                # 和关键名次的分差不超过几分（还要剩余场次在数学上追得上）

standings_check:                 # 用维基百科赛季最终积分榜核对（src/review/standings_check.py）
  raw_dir: data/raw/wikipedia/standings
  first_season: 1993
  last_season: 2025              # 2026/27 还没踢完，不核对
