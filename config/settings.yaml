# 项目配置。路径都相对于项目文件夹，以后搬到云服务器只改这里。
# 密钥不写在这里，写在 config/secrets.yaml（不上传 GitHub，模板见 secrets.example.yaml）。

paths:
  raw: data/raw              # 原始文件（只增不改）
  database: data/football.db # 数据库
  logs: logs
  notes: 学习笔记
  reports: data/reports       # 程序生成的统计报告（从原始层算出来，能重新生成）
  football_data_columns: config/football_data_columns.yaml  # football-data 的数据字典
  teams: config/teams.yaml   # 球队对照表
  team_aliases_wikipedia: config/team_aliases_wikipedia.yaml  # 维基百科条目名 → teams.yaml 的球队
  bookmakers_dongqiudi: config/bookmakers_dongqiudi.yaml  # 懂球帝的公司名（打了星号）→ 我们的公司名
  team_aliases_understat: config/team_aliases_understat.yaml  # Understat 镜像的队名 → teams.yaml 的球队
  # Understat 镜像算出的每场 xG（只做研究实验，不进数据库；src/clean/understat_match.py 生成，见需求文档 6.1）
  understat_xg: data/research/understat_xg.csv
  team_aliases_transfermarkt: config/team_aliases_transfermarkt.yaml  # Transfermarkt（salimt 镜像）球队编号 → teams.yaml 的球队
  # salimt 镜像算出的每场开球前 24 小时两队伤停（只做研究实验，不进数据库；src/clean/injury_features.py 生成，见需求文档第 4 节步骤 7）
  injury_features: data/research/injury_features.csv
  # 备份放在项目文件夹外面：项目文件夹被误删时备份还在。硬盘坏了会一起丢（见需求文档第 13 节）
  backup: D:/足球预测系统_备份

backup:
  keep_days: 30              # 数据库备份保留最近多少天

time:
  storage_timezone: UTC          # 内部统一用标准时间
  display_timezone: Asia/Shanghai # 网页显示北京时间

# 逐场模型解释。仅控制附件和展示，不属于模型参数、不改变预测版本或概率。
explanation:
  enabled: true
  integration_points: 64          # 路径积分还以两倍点数核验，不能把残差分给某个因素
  derivative_step: 0.00001        # 同时以半步长核验数值导数
  atol: 0.000001                  # 解释内部重构及逐项收敛的绝对误差上限
  top_factors: 3

# 赛季用途（需求文档第 5、17 节）。赛季写成开始年份：2023 表示 2023/24
seasons:
  dev_last: 2023             # 开发赛季：2023/24 及以前
  exam: [2024, 2025]         # 期末考试赛季：2024/25、2025/26
  live_first: 2026           # 上线后：2026/27 起

leagues:                     # 第一阶段的联赛（football-data 的联赛代码）
  top: {E0: 英超, SP1: 西甲, D1: 德甲, I1: 意甲, F1: 法甲}
  second: {E1: 英冠, SP2: 西乙, D2: 德乙, I2: 意乙, F2: 法乙}
  # 第 11 阶段（2026-11-03）：football-data “新联赛”文件里的亚洲联赛。一年一个赛季（2024 = 2024 赛季），
  # 不进 top / second：现有按 top、second 跑的下载、导入、预测、网页都不受影响。还没接进实时预测、定时任务、网页
  asia: {JPN: 日职, CHN: 中超, KOR: 韩K}   # KOR：懂球帝来源（2026-11-03 工作树 KR 加，第 4 节“韩K 回补和开发回测”）
  # 第 11 阶段（2026-11-05，工作树 INA）：国家队比赛（martj42），所有国家队一个代码、一个评分池；赛季 = 比赛日期那一年。
  # 不进 top / second：现有按 top、second 跑的下载、导入、预测、网页都不受影响（和 asia 一样）。只做开发回测，没接实时预测
  intl: {INT: 国际赛}
  # 2026-11-07（v1.28）：竞彩也卖的另外五个联赛，只给“竞彩价格偏离虚拟实盘”多攒注（第 14 节）。
  # 比赛直接用懂球帝赛程建（src/clean/dongqiudi_jc_import.py，来源 dongqiudi-jc），只有上线赛季、没有历史，
  # 不进 top / second：模型、预测、网页、积分榜都不碰。代码 N1、P1、SC0 和 football-data 的写法一样；
  # 以后要是从 football-data 导这几个联赛，得先改成像五大联赛那样“投票对上”，不能直接导（队名写法不一样，会重复）
  jc: {N1: 荷甲, P1: 葡超, SC0: 苏超, AUS: 澳超, BRA: 巴甲}

football_data:
  timezone: Europe/London    # football-data 的开球时间是英国当地时间（已核对，见需求文档 6.1）
  refresh_leagues: [E0, SP1, D1, I1, F1, E1, SP2, D2, I2, F2] # 只自动检查当前赛季；已有十联赛范围

# football-data 的“新联赛”文件（需求文档 6.1“新联赛文件”；下载 src/collect/football_data_new.py，导入 src/clean/football_data_new_import.py）
# 一个联赛一个文件、所有赛季都在里面，列和老联赛不一样。现在只有日职、中超（韩K football-data 没有，另找来源）
football_data_new:
  leagues: [JPN, CHN]        # 只下这两个；必须是 leagues.asia 里登记过的代码
  url: https://www.football-data.co.uk/new/{code}.csv
  raw_folder: new            # 存到 data/raw/football-data/new/<联赛>/<下载日期>.csv
  db_source: football-data-new  # 数据库里的来源名。和老联赛的 football-data 分开：老联赛整批重导时只删自己的行，不会删掉这两个联赛
  # 文件里 Time 列的时区（2026-11-03 核对，见需求文档 6.1）：和老联赛一样是英国当地时间
  timezone: Europe/London
  # 当地时区：只用来在质量报告里核对“换成当地时间后开球时间是不是整齐”“英国日期和当地日期差几场”，不改导入的数
  local_timezone: {JPN: Asia/Tokyo, CHN: Asia/Shanghai}
  # 联赛球队的门槛：这个赛季出场次数 ≥ 本季球队出场次数中位数 × 这个比例，才算本季联赛的球队。
  # 文件里混着升降级附加赛（例如 J1 2018 有东京绿茵 3 场、J2 球队之间的附加赛），这些队只踢 1–3 场，低于门槛；
  # 有它们参加的比赛不导入，列进质量报告（附加赛不是联赛比赛，主客场、战意都不一样）
  league_team_min_share: 0.5

# 国家队比赛比分（需求文档第 4 节“第 11 阶段：国际赛进数据库和开发回测”、6.1“国际赛来源调查”）。工作树 INA 加，没接定时任务。
# 下载 src/collect/martj42.py（只访问 raw.githubusercontent.com，各下一次），导入 src/clean/martj42_import.py
martj42:
  base_url: https://raw.githubusercontent.com/martj42/international_results/master   # 仓库 CC0（公有领域）
  robots_url: https://raw.githubusercontent.com/robots.txt   # 下载前先看一次（2026-11-05 是 404：没有限制）
  files:                     # 只下这两个（进球者文件用不到，不下）；值 = 文件开头应该是的列名，不是的话当“内容可疑”
    results: date,home_team,away_team,home_score,away_score,tournament,city,country,neutral
    shootouts: date,home_team,away_team,winner
  raw_folder: martj42        # 存到 data/raw/martj42/<下载日期>/results.csv、shootouts.csv
  db_source: martj42         # 数据库里的来源名
  competition: INT           # 赛事代码（leagues.intl 里登记）
  team_suffix: " NT"         # 球队编号 = 英文名 + 这个后缀（例如 “England NT”），免得和同名俱乐部混在一起
  last_date: "2023-12-31"    # 只导这一天及以前的（开发赛季）；程序里还会按 season_role 再查每个赛季
  # 同一天同一对队两场：一律报错，只有这里登记过的不报错、这一对这一天的几场都不导入（列进报告）。
  # 2026-11-05 核对 results.csv：下面 5 对都是真的同一天踢了两场（阿根廷、乌拉圭同一天在两国首都各踢一场杯赛或友谊赛；
  # 1974 年塔希提、新喀里多尼亚同一天两场友谊赛）。唯一键靠 round = 日期 分开，同一天的分不开，导哪一场都是猜
  same_day_pairs:
    - ["1916-08-15", Argentina, Uruguay]
    - ["1916-10-01", Argentina, Uruguay]
    - ["1924-05-25", Argentina, Uruguay]
    - ["1929-06-16", Argentina, Uruguay]
    - ["1974-02-17", Tahiti, New Caledonia]
  report_file: 国际赛_比分导入报告.md   # 导入报告，放 paths.reports

# 自动维护只更新已登记来源。北京时间每天运行，错过时开机补跑；不触发预测、研究或消息发送。
data_refresh:
  lock_timeout_seconds: 300   # 三个采集入口共用数据库旁的进程锁，最多等待五分钟
  lock_poll_seconds: 0.25
  football_data_at: '08:20'
  cups_at: '07:20'
  task_limit_minutes: 45

cup_refresh:
  enabled: true
  competitions: [UCL, UEL, UECL, FAC, ELC, DFB, CI, CDR, CDF, UESC, ECS, DSC, ISC, SSC, FSC]

scrape:
  min_interval_seconds: 5    # 同一网站两次请求之间至少隔几秒（低频访问）

# GitHub 上别人从 Transfermarkt 抓的球员数据（需求文档 6.1“Transfermarkt 球员数据镜像（salimt）”）。下载程序 src/collect/salimt_mirror.py
# 没有许可证；你决定（2026-10-31）下载到本机，只做伤停研究实验，不转发、不上传、不进数据库。不访问 transfermarkt.com 本身
salimt_mirror:
  repo: salimt/football-datasets
  commit: da9227e1f42baf74561324290dbf1ad2e3c00edd   # 固定在这一版（2026-09-29 更新），以后仓库改了也不影响
  files:                     # 保存的文件名 → 仓库里的路径、开头应该是哪些列（不是的话当“内容可疑”）
    injuries:
      path: datalake/transfermarkt/player_injuries/player_injuries_updated_20260929.csv
      header: player_id,season_name,injury_reason,from_date,end_date
    market_value:
      path: datalake/transfermarkt/player_market_value/player_market_value.csv
      header: player_id,date_unix,value
    transfers:
      path: datalake/transfermarkt/transfer_history/transfer_history.csv
      lfs: true              # 大文件（81MB）放在 Git LFS，走 media.githubusercontent.com
      header: player_id,season_name,transfer_date,from_team_id
    team_seasons:
      path: datalake/transfermarkt/team_competitions_seasons/team_competitions_seasons.csv
      header: club_division,club_id,competition_id
    team_details:
      path: datalake/transfermarkt/team_details/team_details.csv
      header: club_id,club_slug,club_name

# 步骤 7 伤停研究实验（需求文档第 4 节“步骤 7 怎么做”）：src/clean/injury_features.py 用 salimt 镜像算每场两队伤停
injury_research:
  leagues: {E0: GB1, SP1: ES1, D1: L1, I1: IT1, F1: FR1}   # 我们的联赛代码 → Transfermarkt 的联赛编号
  first_season: 2010         # 从这个赛季起算伤停（更早的伤病表记得太少，空值 = 不知道；事先定的，见需求文档）
  mapping_seasons: [2000, 2023]   # 球队对照用哪几个赛季的成绩投票（不碰期末考试赛季）
  hours_before_kickoff: 24   # 算“开球前几小时的情况”（和回测的 T-24 一样）
  top_n: 11                  # “最贵几人”算主力

# GitHub 上别人 2021 年从 Understat 抓的射门明细（需求文档 6.1“Understat 射门明细镜像”）。下载程序 src/collect/understat_mirror.py
# 没有许可证；你决定（2026-10-31）下载到本机，只做个人学习和研究实验，不转发、不上传。不访问 understat.com 本身
understat_mirror:
  repo: douglasbc/scraping-understat-dataset
  commit: 87960c218d873b63daabdd851e93adbecab77faa   # 固定在这一版（2021-12-13 最后一次更新），以后仓库改了也不影响
  first_season: 2014         # 有的赛季：2014/15 到 2021/22（2021/22 只到 2021-12-12，半季）
  last_season: 2021
  leagues:                   # 我们的联赛代码 → 仓库里的文件夹名
    E0: epl
    SP1: la_liga
    D1: bundesliga
    I1: serie_a
    F1: ligue_1

# 懂球帝（赔率来源，需求文档 6.2）。采集程序 src/collect/dongqiudi.py，只存原始层，暂不进数据库
dongqiudi:
  min_interval_seconds: 5    # 两次请求至少隔几秒
  # 懂球帝自己的联赛编号（从它的网页上查到的）。每小时任务、导入都看这里。
  # 2026-11-07 加三个次级联赛（竞彩也卖，给竞彩价格偏离虚拟实盘多攒注）：编号从已存的懂球帝页面里读到
  # （英冠 59、西乙 8 在历届赛季页的联赛菜单里；德乙 7 在比赛详情页的 competition 里），下载后核对过历届赛季页的联赛名。
  # 意乙（10）、法乙（13）历届赛季页是对的，但赛程接口返回空列表（2026-11-07 试了两次），没法每小时抓，没加
  league_ids: {E0: 4, SP1: 3, D1: 5, I1: 9, F1: 12, E1: 59, SP2: 8, D2: 7}
  # 哪些联赛要做历史回补（回补程序、回补进度、数据状态页的“历史回补”都只看这些）。
  # 次级联赛只抓当前赛季（赛前快照 + 踢完的最终赔率），不往回补：2018 起八个赛季一个联赛要几千次请求，现在用不上
  history_leagues: [E0, SP1, D1, I1, F1]
  # 赛程接口一次返回约 40~50 场；“即将开赛”模式往回看几天（补抓刚踢完比赛的最终赔率）、往后看几天
  upcoming_lookback_days: 3
  upcoming_ahead_days: 8
  max_fixture_pages: 4       # 每个联赛每次最多翻几页赛程（防止翻页出错时一直请求）
  fixtures_every_hours: 6    # 每个联赛的赛程每隔几小时才重新抓一次
  # 赛前赔率快照的间隔：离开球越近抓得越勤。[离开球不到几小时, 至少隔几小时抓一次]，从近到远排
  odds_snapshot_rules: [[6, 1], [48, 3], [192, 12]]
  final_after_hours: 3       # 开球后几小时，比赛算踢完，抓一次“最终赔率”（以后不再变）
  # 比赛详情页（xG、射门等技术统计，需求文档 6.1、6.2）：开球后几小时再抓（只抓一次）。
  # 统计赛后多久定下来没有核实过，先留宽一点；要在 upcoming_lookback_days 之内，否则比赛已经不在“即将开赛”看的范围里了
  detail_after_hours: 6
  # 首发页（需求文档 6.2、6.5）：开球前几小时以内开始看、每隔几小时看一次（每小时任务运行时检查）。
  # 名单变了才存；踢完以后和详情页一起再存一次“实际首发”
  lineup_hours_before: 6
  lineup_every_hours: 1
  # 详情页补抓从哪天起：懂球帝的 xG 英超 2025-12-03 起有（11-30 还没有），别的联赛没逐场查，往前多留两周
  detail_backfill_from: "2025-11-15"
  backfill_first_season: 2018  # 历史回补最早的赛季（2026-10-31 定：只补赔率比较全的 2018/19 起；试验时用的是 2010，见 6.2.1）
  probe_matches_per_season: 3  # 试验模式：每个赛季抽几场看有没有赔率
  # 导入数据库（src/clean/dongqiudi_import.py）：
  # 懂球帝“时间待定”（Uncertain）的比赛，开球时间是占位的（同一轮都写成同一个时间，常常是这一轮靠后的日子），
  # 所以日期往前挪几天，当作“这一轮从哪天开始”（date_precision = round），宁早勿晚，取数层就不会让赛前预测看到开球后的东西
  uncertain_back_days: 3
  # 比赛进行中的实时比分（src/collect/dongqiudi_live.py，需求文档 6.2“比赛中实时比分”）。只写一个给网站看的小文件，
  # 不存原始层、不进数据库的比赛表、不进模型。和上面同一个接口、同一个 5 秒限速；网站服务器设置 live.live_poller: true 时才在后台跑
  live:
    before_minutes: 5          # 开球前几分钟开始看（这个联赛有比赛进入“开球前 5 分钟到开球后 150 分钟”才请求）
    after_minutes: 150         # 开球后几分钟还没确认踢完就继续看（90 分钟 + 中场 + 补时，再留些余量给晚开球的）
    every_seconds: 120         # 同一个联赛两次请求至少隔几秒（所有懂球帝请求之间仍然至少隔 min_interval_seconds）
    pause_minutes: 60          # 遇到 403、429 或拦截页后停多少分钟（不重试绕过，不换 UA、不加 cookie、不登录）
    show_played_minutes: 300   # 踢完的比赛开球后几分钟内还显示（约等于踢完以后再留 3 小时）
    idle_check_minutes: 10     # 后台线程最多隔几分钟醒来看一次（数据库可能刚导入了新的开球时间）
    output: data/live/scores.json  # 写到哪个文件（先写临时文件再改名，网站不会读到写了一半的）

# 竞彩联赛（leagues.jc，需求文档 6.2“竞彩联赛”、第 14 节“竞彩价格偏离虚拟实盘”）。2026-11-07（v1.28）加。
# 每小时任务（src/jobs/refresh_data.py）在五大联赛那一套采集、导入做完以后再做这一段：
# 采集用同一个采集程序（同一个 5 秒请求时钟、403/429 就停），导入是 src/clean/dongqiudi_jc_import.py。
# 这几个联赛数据库里本来没有比赛：比赛、球队都按懂球帝赛程建，球队编号 = 懂球帝最近的中文写法（不编英文名）。
# 只导上线赛季（season_role = live），不做历史回补
dongqiudi_jc:
  db_source: dongqiudi-jc    # 数据库里的来源名（和五大联赛的 dongqiudi、韩K 的 dongqiudi-kor 分开）
  # 采集用的设置：没写的照搬上面 dongqiudi 段
  collect:
    # 懂球帝联赛编号，从已存的懂球帝页面里读到；2026-11-07 每个联赛先请求一次赛程、抽 4 场赔率核对过
    # （五个联赛都有赛程，赔率表里有平博亚盘、大小球，抽到的场里有竞彩价格的：荷甲 1/4、葡超 1/4、苏超 0/4、澳超 1/4、巴甲 0/4）
    league_ids: {N1: 1, P1: 52, SC0: 36, AUS: 257, BRA: 19}
    upcoming_ahead_days: 3     # 竞彩一般开球前一两天才开卖，往后看 3 天够了
    # 快照只抓开球前 48 小时以内（决定时间是开球前 6 小时左右、最早开球前十几个小时），省请求
    odds_snapshot_rules: [[6, 1], [48, 3]]
    details: false             # 不抓比赛详情页（xG 这些用不上）
    lineups: false             # 不抓首发页
  calendar_year: [BRA]       # 一年一个赛季的联赛（赛季 = 开球那年）；别的按 7 月起算新赛季（澳超 10 月开始，2026 = 2026/27）
  country: {N1: 荷兰, P1: 葡萄牙, SC0: 苏格兰, AUS: 澳大利亚, BRA: 巴西}   # teams 表的国家（澳超的惠灵顿凤凰、奥克兰FC 其实是新西兰队，按联赛记）
  report_file: 竞彩联赛_导入报告.md   # 导入报告（放 paths.reports 里）

# 韩K（K联赛 1 级）历史回补和导入（需求文档第 4 节“第 11 阶段：韩K 回补和开发回测”）。工作树 KR 里做，没接定时任务。
# 采集 src/collect/dongqiudi_kor.py（用懂球帝采集程序的低频、停止规则），导入 src/clean/dongqiudi_kor_import.py。
# 不放进上面 dongqiudi.league_ids：每小时的懂球帝任务、懂球帝导入、数据状态页都只看那里，碰不到韩K
dongqiudi_kor:
  league: KOR                # 我们的联赛代码（leagues.asia 里登记）
  league_ids: {KOR: 117}     # 懂球帝的联赛编号（历届赛季页 https://m.dongqiudi.com/zhanbao/lishi/117）
  calendar_year: true        # 一年一个赛季：历届赛季页写“2023”，不是“2023/24”
  min_interval_seconds: 10   # 两次请求至少隔几秒（比五大联赛的 5 秒慢一倍）
  first_season: 2010         # 赛季页从哪年下（2010–2016 只当热身历史）
  odds_first_season: 2017    # 赔率从哪年下（2015 没有赔率；2017 起胜平负 2–3 家，见需求文档 6.1）
  last_season: 2023          # 到哪年为止：只下开发赛季（考试赛季 2024、2025 不下，程序里还会按 season_role 再查）
  db_source: dongqiudi-kor   # 数据库里的来源名（和五大联赛的 dongqiudi 分开）
  country: 韩国              # teams 表的国家
  local_timezone: Asia/Seoul # 韩国时间：导入时查英国、北京、韩国三个日期是不是一样
  report_file: 韩K_导入报告.md   # 导入报告（放 paths.reports 里）
  # 轮次名字怎么分（2026-11-03 把 2010–2023 十四季的赛季页都看过）。两样都不是的名字，下载和导入都报错（不猜）
  # 联赛比赛：“<下面的前缀> 第N轮”。常规赛以后分组打的争冠组、保级组（以前叫冠军附加、降级附加）也是联赛比赛
  league_round_prefixes: [联赛, 争冠组, 保级组, 冠军附加, 降级附加]
  non_league_rounds:          # 不是联赛比赛（不导入、不下赔率）
    - 升降级附加赛            # K1 倒数几名和 K2 球队的附加赛（2021、2022、2023 赛季页最后一个轮次）
    - 附加赛第一轮            # 2010、2011 前 6 名的冠军季后赛（淘汰赛）
    - 附加赛 第2轮            # 2010 冠军季后赛第二轮（只有 1 场；名字像“第N轮”，但是淘汰赛）
    - 附加赛                  # 2011 冠军季后赛第二轮
    - 附加赛半决赛            # 2011 冠军季后赛半决赛
    - 半决赛                  # 2010 冠军季后赛半决赛
    - 总决赛                  # 2010 冠军季后赛决赛（两回合）
    - 决赛                    # 2011 冠军季后赛决赛（两回合）
  league_team_min_share: 0.5 # 一季出场次数少于“本季中位数 × 这个数”的队不该有（有就报错，说明上面的规则漏了）
  min_books_average: 2       # “多家平均”至少要几家公司（2017 年一场只有 2 家胜平负）
  max_requests: 400          # 一次运行最多发几次请求（分段跑：到数就停，下次接着来）

# 国际赛（国家队）懂球帝赔率回补和导入（需求文档第 4 节“第 11 阶段：国际赛进数据库和开发回测”的“赔率（INB）”）。工作树 INB 里做，没接定时任务。
# 采集 src/collect/dongqiudi_intl.py（用懂球帝采集程序的低频、停止规则），导入 src/clean/dongqiudi_intl_import.py。
# 不放进上面 dongqiudi.league_ids：每小时的懂球帝任务、懂球帝导入、数据状态页都只看那里，碰不到国际赛
dongqiudi_intl:
  # 开球时间（UTC）在这两天之间（含两头）的比赛才下赔率、才导入。2021 起：6.1 抽查 2016 没有赔率、2017 和 2018 胜平负只有 3 家。
  # 2024 起是考试赛季：程序里按 season_role 再查，kickoff_to 那一年不是开发赛季就报错；开球 2024-01-01 及以后的比赛一律不下
  kickoff_from: "2021-01-01"
  kickoff_to: "2023-12-31"
  min_interval_seconds: 10   # 两次请求至少隔几秒（和韩K 一样）
  db_source: dongqiudi-intl  # 数据库里的来源名
  competition: INT           # 国际赛在数据库里的赛事代码（INA 导入 martj42 比分时建的比赛；赔率只挂到这些比赛上）
  score_source: martj42      # 拿来核对比分的来源（INA 写的 match_stats）
  min_books_average: 2       # “多家平均”至少要几家公司（和韩K 一样）
  max_requests: 400          # 一次运行最多发几次请求（分段跑：到数就停，下次接着来）
  report_file: 国际赛_赔率导入报告.md   # 导入报告（放 paths.reports 里）
  teams_file: config/teams_intl.yaml   # 懂球帝球队编号、中文名 → martj42 英文名（Claude 逐个看过才写进去）
  martj42_suffix: " NT"      # 国家队的球队编号 = martj42 英文名 + 这个后缀（INA 导入比分时的写法）
  # 赛事：我们的文件夹代码 → 懂球帝赛事编号（cid）和要下的赛季 {文件夹名: 懂球帝赛季编号 sid}。
  # 赛季编号 2026-11-05 从历届赛季页（世界杯、欧洲杯、欧国联、亚洲杯、美洲杯、金杯、非洲杯）和国家队页面
  # （预选赛没有历届赛季页）查出来；下载时核对赛季页里的 sid、cid 和这里一样，不一样就停。
  # 一个赛季页里开球不在上面日期范围里的比赛不下（例如预选赛 2026 周期的 2024 年比赛）。
  # 没列的：亚洲杯 2023（225 / 14593）、非洲杯 2023（351 / 19407）正赛在 2024 年踢，按要求不下；
  # 中北美国联、东亚杯、阿拉伯杯、非洲国家锦标赛、FIFA 系列赛不在需求文档的赛事清单里，没下。
  competitions:
    INT_WC: {cid: 61, seasons: {"2022": 10346}}                       # 世界杯（2022-11-21 到 12-18）
    INT_EURO: {cid: 18, seasons: {"2020": 2018}}                      # 欧洲杯（“2020”在 2021-06、07 踢）
    INT_UNL: {cid: 2442, seasons: {"2020-21": 15264, "2022-23": 18936}}   # 欧国联（2021 年 10 月的决赛阶段在 2020-21 里）
    INT_WCQ_UEFA: {cid: 203, seasons: {"2022": 10409}}                # 世预赛欧洲区（2021-03 到 2022-03 附加赛）
    INT_EUROQ: {cid: 883, seasons: {"2024": 17710}}                   # 欧洲杯预选赛（2023-03 到 11；2024-03 附加赛按日期不下）
    INT_WCQ_CONMEBOL: {cid: 204, seasons: {"2022": 10410, "2026": 21571}}  # 世预赛南美区（2026 周期 2023-09 起）
    INT_WCQ_CONCACAF: {cid: 205, seasons: {"2022": 10411}}            # 世预赛中北美区（2026 周期 2024-06 起，不用）
    INT_WCQ_CAF: {cid: 206, seasons: {"2022": 15458, "2026": 21737}}  # 世预赛非洲区（2026 周期 2023-11 起）
    INT_WCQ_AFC: {cid: 207, seasons: {"2022": 14634, "2026": 20227}}  # 世预赛亚洲区（2026 周期 2023-10 起）
    INT_WCQ_OFC: {cid: 208, seasons: {"2022": 10412}}                 # 世预赛大洋洲区（2022-03；2026 周期 2024-10 起，不用）
    INT_COPA: {cid: 262, seasons: {"2021": 15435}}                    # 美洲杯
    INT_GOLD: {cid: 224, seasons: {"2021": 15434, "2023": 21056}}     # 金杯
    INT_AFCON: {cid: 351, seasons: {"2021": 18955}}                   # 非洲杯（“2021”在 2022-01、02 踢）

# 数据状态页 src/jobs/status_page.py（需求文档第 6.2、8 节）：超过这些界限就在网页上标出来，并弹窗提醒一次
status:
  data_health:
    football_data_stale_hours: 36 # 每日检查，留出来源发布和开机补跑余量
    cup_stale_hours: 36
    dongqiudi_stale_hours: 8     # 赛程每六小时检查；每小时任务自身另按两小时监控
    result_lookback_days: 7
    result_due_hours: 3
    upcoming_days: 8
    closing_snapshot_stale_hours: 30
  hourly_stale_hours: 2      # 懂球帝每小时任务超过几小时没成功，算出错（关机、睡眠或程序坏了）
  max_failures_24h: 3        # 最近 24 小时失败超过几次算“注意”（偶尔一两次多半是网络抖动）
  backup_stale_hours: 30     # 最新备份超过几小时，算“注意”（每天 3:30 备份一次，留一点余地）
  # 懂球帝导入留下的问题（读 data/reports/dongqiudi_导入_*.csv 和 config/teams.yaml）。超过界限算“注意”，弹窗一次
  list_rows: 30              # 清单在页面上最多列几行，多的只写总数
  max_pending_team_names: 0  # 懂球帝队名对照里没定下来的中文名超过几个（没定下的队，比赛不导入，有一个就要看）
  # teams.yaml 中文名空着、而且回补起始赛季（dongqiudi.backfill_first_season）起在五大联赛出场过的球队超过几个。
  # 只看这些：其余 200 多个是次级联赛和以前的球队，网页暂时用不到，只列出来不报警
  max_blank_recent_team_names: 0
  # 没对上的比赛超过几场。2026-10-31 第一次导入有 5 场，都查过原因（判罚比分、附加赛，见进度记录），
  # 所以不是 0；超过多半是出了新情况（某个队改名、整季对不上）。这是先定的数，以后按实际情况调
  max_unmatched_matches: 10

# 预测页预览版 src/predict/preview.py + src/web/preview_page.py（需求文档第 8 节“早期简易页”，2026-10-31 提前到第 2 阶段）
preview:
  days_ahead: 7              # 显示未来几天开球的比赛
  leagues: top               # 哪一组联赛（leagues 段里的 top 五大联赛 / second 次级联赛）
  model: gb_xg               # 用哪个模型（models 段里的名字）。2026-10-31 从 Elo 换成 dc，同一天又换成 gb_l7（步骤 6 选出的），页面上仍标“临时模型”
                             # 2026-11-07 你决定从 gb_l7 换成 gb_xg（需求文档第 4 节“换成 gb_xg 上线”）；想退回：这里、ledger.model 写回 gb_l7，shadow.models 写回 [gb_xg]
  # 页面上关于模型的说明，换模型时一起改。回测成绩：五大联赛 2014–2023 有平博收盘赔率的 18,083 场，T-24，胜平负 log loss
  # （越小越准）；出处是进度记录“步骤 6”的结果目录 s6_eval 的 summary_vs_benchmark.csv（gb_l7 0.97888，平博收盘 0.96429）
  # 换成 gb_xg 后回测成绩照用 gb_l7 的：懂球帝 xG 2025-12 起才有，2014–2023 每场都没有 xG，gb_xg 在这些年按代码就是用进球更新（推断，没重跑回测）
  model_info:
    label: 梯度提升树 gb_xg
    desc: 把动态实力评分、Elo、pi-rating、近期状态、射正、休息天数等一起交给一种“很多棵小决策树”的模型，先猜两队各进几球，再算胜平负；动态实力评分每场赛后用一半实际进球、一半 xG 更新（有 xG 的比赛，2025 年 12 月起）
    backtest_period: 2014–2023
    backtest_n: 18083
    backtest_model: 0.979
    backtest_pinnacle: 0.964
  # “差距大”的界限不在这里：用 confidence_study.gap（6%，检验二的最高一组，和信心等级的“分歧大”同一个数）。
  # 2026-11-01 之前这里是 gap_threshold: 0.10（先定的、没检验过），接融合时删掉（需求文档第 5 节“预测页怎么接融合、倾向、信心等级”）
  # 不确定因素“赔率最近大幅变动”：融合用的胜平负概率和 hours 小时前比，有一项变了不少于 min_change 就列出来。
  # 先定的数，没有用数据检验过（回测只有一个赛前时点，检验不了）；只是提醒，不改信心等级
  odds_move:
    hours: 24
    min_change: 0.05
  output: data/reports/preview.html   # 生成的网页（在 data/ 里，不上传 GitHub）

inventory:
  full_coverage: 0.9        # 覆盖表里，一个赛季有数据的比赛占多少以上算“有”

quality:                     # 数据质量检查的界限（需求文档第 16 节）；超出就列进质量报告
  min_odds: 1.01             # 赔率低于这个当作错误值，导入时不要
  max_handicap: 5            # 亚盘盘口绝对值超过这个当作错误值
  # 赔率倒数之和（含抽水）的正常范围。范围是 2026-10-30 按 football-data 189 万组赔率的实际分布定的：
  # 普通公司 99.9% 的数据都落在范围里，超出的多半是录错。
  overround:
    1x2: [1.0, 1.25]         # 普通公司 胜平负（三个倒数相加）
    2way: [1.0, 1.15]        # 普通公司 大小球、亚盘（两个倒数相加）
    exchange: [0.97, 1.10]   # 交易所：不是公司定价，是玩家互相挂单，抽水接近 0，冷门比赛挂单少时会偏离
    best: [0.85, 1.25]       # 多家最高：每个结果各挑一家最高的，倒数之和低于 1 很正常，低太多才是录错
  exchanges: [Betfair 交易所]
  best_of: [多家最高]

calc:                        # 纯计算工具（src/common/odds.py、settlement.py、markets.py，src/evaluate/metrics.py）
  devig_method: proportional # 默认去水方法：proportional 按比例（需求文档第 16 节）；第 3 阶段比较 shin、power
  solver_tol: 1.0e-12        # Shin 法、幂函数法解方程的精度（去水后概率之和与 1 的差距不超过这个）
  max_goals: 10              # 比分矩阵每队算到几球（需求文档第 3 节：内部算到每队 10 球）；超过的概率并进最后一行/列
  prob_sum_tol: 1.0e-6       # 概率加起来和 1 差多少以内算正常（比分矩阵、每场的胜平负概率）；差得更多说明算错了，报错
  logloss_eps: 1.0e-15       # log loss：概率低于这个按这个算，避免 log(0) = 负无穷（写成 1.0e-15，YAML 才认成数字）
  calibration_bins: 10       # 校准表分几个箱（0–10%、10–20%……）

features:                    # 取数层 src/features（需求文档第 16、17 节“不偷看未来”“数据用途”）
  data_usage: config/data_usage.yaml   # 数据用途字典：每类数据什么时候能知道、允许用在哪里
  current_stage: 2           # 现在做到第几阶段。数据用途字典里“模型输入从第几阶段起”和它比（角球黄牌 10、欧战比分 8）
  # 比分、统计开球后几个小时才算“能知道”：90 分钟 + 中场 15 分钟 + 补时，约 2 小时踢完，再留 1 小时给数据更新。
  # 要模拟“football-data 过几天才更新”的延迟（需求文档 6.2），把这个数调大再回测。
  result_available_after_kickoff_hours: 3
  # 赛前赔率什么时候算“能知道”（按来源分），两种写法，一个来源只登记一种；两种都没登记的来源一律拿不到。
  # 1）开球前几个小时（pre_odds_hours_before_kickoff）。现在没有来源用这一种。
  #    以前 football-data 写 24（当作 T-24 版的赔率）；2026-11-06 时间核对发现周二、周五的比赛是当天下午才采的，比 T-24 晚，改成第 2 种。
  #    退回原来的规则：这里放回 football-data: 24，删掉下面 pre_odds_collection 里的 football-data。
  pre_odds_hours_before_kickoff: {}
  # 2）按采集时间（pre_odds_collection）：比赛日（date_only_timezone 的日期）当天或之前、最近的一个采集日（weekdays，周一 0 … 周日 6），
  #    hour 点（date_only_timezone 的时间）。football-data 说明文件：周末比赛周五下午采、周中比赛周二下午采，没写几点，
  #    “下午”取晚的一头 18 点，宁可晚知道（需求文档第 16 节“时间核对（第 1 步）”第 1 条怎么修）。
  pre_odds_collection:
    football-data: {weekdays: [1, 4], hour: 18}
  # 只有日期、没有开球时间的比赛，日期按哪个时区的“一天”算（football-data 的日期是英国当地日期）
  date_only_timezone: Europe/London
  # 只知道“这一轮从哪天开始”的杯赛（date_precision = round），按这一轮最长持续几天算最晚开球（比分晚知道，不偷看）
  round_date_window_days: 7
  # 只知道“比赛当地的日期”、不知道时区的国际赛（date_precision = day_world，martj42）：按全世界最东、最西的时区算
  # 最早开球 = 这一天 00:00（UTC+14）= 前一天 10:00 UTC；最晚开球 = 这一天 24:00（UTC−12）= 第二天 12:00 UTC
  day_world_earliest_utc_offset_hours: 14
  day_world_latest_utc_offset_hours: -12
  # 同一场比赛有几个来源的统计时，每一类数据（比分、射门和 xG……，按数据用途字典分）各挑一个来源：
  # 先挑这类数据填得最全的来源，一样全的按这个顺序。例如 2025/26 的比分用 football-data、xG 用懂球帝（football-data 没有）。
  # 懂球帝的比分在 football-data 还没更新的当前赛季比赛上补；xG、射门来自懂球帝的比赛详情页（2025-12 起有 xG）
  stats_source_priority: [football-data, dongqiudi]

backtest:                    # 回测框架 src/evaluate/backtest.py（需求文档第 5 节“按时间滚动回测”“回测的计算量”）
  output_dir: data/backtest  # 回测结果放这里（data/ 不进 Git）；每次运行一个子文件夹
  horizons: [24, 6, 1]       # 预测时点：开球前几小时（T-24 / T-6 / T-1）
  refit_days: 7              # 参数每隔几天重新拟合一次（第 5 节：按周，不按每场）。Elo 评分本身每场赛后都更新，这里管的是“评分 → 概率”的换算参数
  eval_after_kickoff_hours: 72  # 打分时“站在”开球后几小时取本场比分和收盘赔率（比 features 的 3 小时缓冲、只有日期时的 27 小时都长）
  benchmark_bookmaker: 平博 Pinnacle  # 参考标杆 1：这家公司的收盘胜平负赔率去水（第 5 节标杆 1）
  # 参考标杆 2：多家公司平均的收盘胜平负赔率去水（football-data 2019/20 起才有）。
  # 没有收盘平均的比赛（2018/19 及以前）用同一个“多家平均”的赛前赔率代替，结果里时点写“赛前代替”
  benchmark_avg_bookmaker: 多家平均
  benchmark_devig_method: proportional  # 两个标杆用哪种去水。只管回测标杆，不影响 calc.devig_method（预测页用的）
  window_start_md: "06-15"   # 按赛季取预测目标时，日期窗口从这年的几月几日开始（再按 season 列筛，窗口只是为了少查）
  window_end_md: "07-01"     # 窗口到下一年的几月几日（2019/20 疫情延期的赛季按 season 列筛，不受影响）
  # 一年一个赛季的联赛（日职、中超，第 11 阶段）：赛季在一个日历年里（中超 2021 踢到 2022-01-12），
  # 上面“6 月 15 日到下一年 7 月 1 日”的窗口不适用（会漏掉 2–6 月的比赛，最后一季还会碰到下一个考试赛季）。
  # 这些联赛组的窗口：从第一个赛季那年的 start_md 到最后一个赛季下一年的 end_md（再按 season 列筛）。
  # end_md 选 2 月 1 日：中超 2021 最晚一场 2022-01-12，两个联赛最早开赛是 2 月 14 日（日职 2025），一场考试赛季都碰不到。
  # 和跨年赛季的联赛不能放在同一次回测里（窗口不一样），混在一起直接报错
  calendar_year_groups: [asia]
  calendar_year_window: {start_md: "01-01", end_md: "02-01"}

rest_days:                   # 休息天数和“欧战后”标签（src/features/rest_days.py，需求文档第 4 节“步骤 6 怎么做”）
  euro_competitions: [UCL, UEL, UECL]   # 哪几个赛事算“欧战”
  euro_within_days: 4        # 上一场是欧战、而且隔了这么多天以内，才算“欧战后”
  cap_days: 30               # 休息天数最多记多少天（休赛期、第一场都记这个数）

compare:                     # 两个模型比较 src/evaluate/compare.py（第 5 节“怎么算真的更准”）
  n_boot: 2000               # bootstrap 重复抽样次数
  confidence: 0.95           # 可信区间的置信水平：95% 区间
  seed: 20261030             # 随机种子：同样的数据每次算出同样的区间
  block: week                # 按什么成块抽样：week 按周（同一周的比赛一起抽）/ day 按比赛日 / match 每场单独抽
  primary_metric: log_loss   # 下结论主要看哪个分数（另外两个也列出来）

devig_compare:                # 去水方法比较 src/evaluate/devig_compare.py（需求文档第 16 节“去水方法比较”，比较前写下，不临时加）
  output_dir: data/backtest/devig_compare   # 结果放这里（data/ 不进 Git）
  leagues: [top, second]     # leagues 段里的哪几组联赛：五大联赛 + 次级联赛
  methods: [proportional, shin, power]
  pairs:                     # 比哪几组：[基准, 新]，差 = 新 − 基准，小于 0 = 新的更准
    - [proportional, shin]
    - [proportional, power]
    - [shin, power]
  sources:                   # 用哪几组收盘胜平负赔率，分开比
    pinnacle_close: {bookmaker: 平博 Pinnacle, first: 2012}   # 平博收盘 2012/13 起
    avg_close: {bookmaker: 多家平均, first: 2019}             # 多家平均收盘 2019/20 起
  longshot_below: 0.20       # 只看不下结论：按比例去水后概率低于这个的选项算“冷门”，比较各方法给冷门的概率和实际发生比例

market_checks:                # 三个检验和市场比分矩阵 src/evaluate/market_checks.py（需求文档第 5 节，跑之前写下，不临时加）
  sources: [平博 Pinnacle, 多家平均]   # 赛前赔率按顺序选：前面的公司有就用前面的；收盘赔率只用同一家的（没有就不进检验三）
  matrix_source: 多家平均        # 市场比分矩阵用哪家的赛前胜平负 + 大小球 2.5（多家平均 2005 年起就有大小球）
  gap_bins: [0.03, 0.06]         # 检验二按分歧大小分三组的分界：3% 以内 / 3%–6% / 6% 以上
  lopsided: 0.60                 # 赛前赔率里最大的那个概率 ≥ 60% 算“强弱分明”，否则“势均力敌”
  follow_min_gap: 0.03           # 检验三“往模型方向走的比例”只看分歧 ≥ 3%、而且赔率真的变了的比赛
  max_goals: 10                  # 比分矩阵算到每队几个球（和模型一样）

market_odds:                  # 步骤 8 B 版的赔率特征 src/features/market_odds.py（需求文档第 4 节“步骤 8 怎么做”，跑之前写下）
  source: football-data          # 只用这个来源的赛前赔率（离开球约 1–3 天，按 T-24 算）
  result_books: [平博 Pinnacle, 多家平均]   # 胜平负按顺序选：前面的公司有就用前面的（和 market_checks.sources 同一条规则）
  pinnacle_book: 平博 Pinnacle     # mo_pinnacle = 胜平负用的是不是这家（按名字认，不靠排第几）
  ou_book: 多家平均               # 大小球 2.5 用哪家（多家平均 2005 年起就有，平博 2019 年起才有）
  ou_line: 2.5
  devig_method: proportional     # 按比例去水（和回测标杆 backtest.benchmark_devig_method 一样）
  max_goals: 10                  # 反推市场预期进球时比分矩阵算到每队几个球

fusion_study:                 # 用 A 版重选融合权重和倾向门槛 src/evaluate/fusion_study.py（需求文档第 5 节“用 A 版重选融合权重和倾向门槛怎么做”，跑之前写下）
  model: gb_l7                   # 用哪个模型的比分矩阵（上线的 A 版）
  horizon: T-24                  # 用哪个时点的预测（赛前赔率 T-24 起才能知道）
  usage: 融合                    # 取赔率的用途（数据字典）
  ah_book: 多家平均               # 亚盘倾向用哪家的赛前亚盘线
  ah_main_odds: [1.5, 2.7]       # 亚盘线两边赔率都在这个范围里才算“主盘口”（接近五五开）；2008–2010 有些场的线是 0、赔率 1.04 / 9.05，不是主盘口，不用
  w_step: 0.05                   # w 从 0 到 1 每档多少（21 档）
  rolling_first: 2006            # 滚动选 w 从哪个赛季开始（只用它之前的赛季选）
  period_split: 2014             # 两段分开报告：这个赛季之前（树的设置在这一段选的）/ 这个赛季起
  lean_bands:                    # “偏向多大”分档的边：最后一个数往上是一档（例如 0.20 以上）
    result: [0, 0.02, 0.04, 0.06, 0.08, 0.10, 0.12, 0.14, 0.16, 0.18, 0.20]
    draw: [0.26, 0.28, 0.30, 0.32, 0.34]
    over25: [0, 0.02, 0.04, 0.06, 0.08, 0.10]
    btts: [0, 0.02, 0.04, 0.06, 0.08, 0.10]
    ah: [0, 0.02, 0.04, 0.06, 0.08, 0.10]
  lean_min_gap:                  # 每档“实际”的平均至少要这么大才算有倾向（事先定的主观判断）
    result: 0.05
    draw: 0.03
    over25: 0.04
    btts: 0.04
    ah: 0.04

fusion:                       # 融合权重（fusion_study 选出来的，需求文档第 5 节“用 A 版重选融合权重和倾向门槛 结果”）
  w: 1.0                         # 融合 = w × 赔率 + (1 − w) × 模型。滚动选 w 每季都选 1，没比纯赔率更准 → 定为 1（融合概率就是赔率概率）
  model: gb_l7                   # 这个 w 是用哪个模型选的（换模型要重选）

lean:                         # 倾向门槛（同上；页面以后按它写“倾向 / 无明显倾向 / 平局风险高”）。null = 一律“无明显倾向”
  result: 0.04                   # 胜平负：最高的概率比第二高的高这么多才写倾向
  draw: 0.28                     # 平局概率不低于这个标“平局风险高”（第 16 节“平局风险门槛”v1.14 新规则定的；
                                 # 原来的规则会推到 0.34，v1.21 误改成 0.34，v1.22 改回）
  over25: 0.02                   # 大小球 2.5：偏向那边的概率 − 0.5 不小于这个
  btts: 0.02                     # 双方进球：同上
  ah: 0.02                       # 亚盘（多家平均赛前主盘口）：两边较大的胜算 − 0.5 不小于这个

confidence_study:             # 定信心等级规则 src/evaluate/confidence_study.py（需求文档第 5 节“信心等级规则怎么定”，跑之前写下）
  model: gb_l7                   # 用哪个模型算“分歧”（上线的 A 版）
  horizon: T-24                  # 用哪个时点（赛前赔率 T-24 起才能知道）
  gap: 0.06                      # 模型和赔率在主胜、平、客胜上差得最多的那个不小于这个 = “分歧大”（检验二的最高一组）
  early_rounds: 10               # 赛季前几轮（和 early_rounds.py 同一个数法）
  min_diff: 0.002                # 一个因素“算数”：差的区间下限 > 0，而且差不小于这个（事先定的主观判断）
  period_split: 2014             # 两段分开报告（只报告）

confidence:                   # 信心等级规则（confidence_study 选出来的，需求文档第 5 节“信心等级规则结果”）。从 3（●●● 高）开始，最低 1（●○○ 低）
  downgrade_factors: []          # 每碰上一个降一级。候选 gap / early / promoted / no_pinnacle，开发赛季回测一个都不算数
  no_odds_downgrade: 1           # 一家赔率都没有（只出模型概率）再降几级（第 5 节“融合用哪家赔率”第 3 条）

odds_move_study:              # 赔率走向研究 src/evaluate/odds_move_study.py（需求文档第 14 节“赔率走向研究怎么做”，跑之前写下，不临时加）
  output_dir: data/backtest/odds_move   # 结果放这里（data/ 不进 Git）
  usage: 机器人下注               # 取数用途（数据字典里赔率走向模型属于这一栏）
  leagues: [E0, SP1, D1, I1, F1]  # 五大联赛
  first_season: 2019              # 从 2019/20 起（懂球帝 2018/19 没有开球时间，T-24 算不准）
  horizons: [24, 6, 1]            # 时点：开球前几小时
  main_horizon: 24                # 三个主要结论看哪个时点
  last_minutes: 1                 # “最后价格”：开球前 1 分钟的最后一个价格（不是真收盘）
  bookmaker_file: config/bookmakers_dongqiudi.yaml   # 公司名对照表
  trusted_basis: 核对过           # 只用对照表里“依据”写这个的公司（名字不确定的不用）
  min_books: 3                    # 一场比赛这个时点至少几家公司同时有价格才算
  moved_threshold: 0.005          # 热门概率变了 0.5 个百分点以上算“动了”
  min_season_matches: 200         # 一个赛季至少几场才算“够样本”
  min_seasons: 3                  # 至少几个够样本的赛季才下结论
  min_total_matches: 3000         # T-24 能用的比赛合计至少几场才下结论
  min_abs_mean: 0.005             # 结论 A：平均 ΔF 的绝对值至少这么大
  same_odds_tol: 0.01             # 和 football-data 收盘比：三个赔率都差不超过这个算一样

picks_filter_study:           # 竞彩二次筛选研究 src/evaluate/picks_filter_study.py（需求文档第 14 节“竞彩二次筛选研究怎么做”，跑之前写下，不临时加）
  output_dir: data/backtest/picks_filter_tc   # 结果放这里（data/ 不进 Git）；_tc = 新时间规则重跑（2026-11-07）
  base_run: rr_pf_base            # 第一层回测的结果文件夹（data/backtest/ 下，要有 predictions.csv 和 matrices_<模型>.npz）；2026-11-07 新时间规则重跑
  model: gb_l7                    # 第一层：方向按它定
  dyn_model: dyn_q1e5_b01         # 第一层的第二个模型（只用来算“模型分歧”）
  horizon: T-24                   # 第一层用哪个时点（赛前赔率 T-24 起才能知道）
  hours: 24                       # 特征的截止时间：开球前几小时
  leagues: [E0, SP1, D1, I1, F1]  # 五大联赛
  eval_first: 2019                # 打分赛季：2019/20–2023/24
  eval_last: 2023
  train_first_result: 2012        # 胜平负二次筛选模型的训练比赛从这个赛季起（平博 2012/13 起有赔率）
  train_first_handicap: 2017      # 让球的训练比赛从这个赛季起（要有竞彩让球数）
  block_days: 28                  # 每多少天重新训练一次（每块从星期一开始）
  min_train_rows: 1000            # 训练行少于这么多，这一块不出 C 的结果
  k: 5                            # 主结果：每个玩法每周挑几场
  k_extra: [3, 10]                # 只列出来看看
  n_random: 2000                  # 随机挑重复几次（E）
  usage: 研究实验                  # 取特征的用途（只在开发模式）
  eval_usage: 研究评估             # 取竞彩赔率的用途（赛后、只算虚拟回报）
  lottery_cutoff_utc: "2026-11-03 00:00:00"   # 取竞彩赔率的截止时间（回补的历史价格都是 2026-10-30 到 11-02 抓的）
  products: {result: 竞彩胜平负, handicap: 竞彩让球}
  move_books: [Bet365, 平博 Pinnacle]   # 盘口水位变化只比同一家公司：懂球帝初盘 → football-data 赛前价格
  lgbm:                           # 二次筛选模型的设置（事先定，不调）
    num_leaves: 7
    min_data_in_leaf: 100
    learning_rate: 0.03
    n_rounds: 300
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    seed: 20261103
  min_hit_diff: 0.02              # J2：C − B 的命中率差至少这么多（2 个百分点）才算“有用”
  min_same_sign_seasons: 4        # J2、J3：5 个打分赛季里至少几个赛季方向一样
  score_bins: 5                   # 按分数分几档看命中率和 ROI（只看看）
  expected_payout: 0.88           # 核对：竞彩返奖率应该约这么多

final_exam:                   # 期末考试（预测部分）src/evaluate/final_exam.py（需求文档第 5 节“期末考试怎么考”，跑之前写下）
  done: true                     # 考过一次后改成 true 提交，程序就不能再考（只考一次）
  run_name: final_exam           # 结果放 data/backtest/<这个名字>/（data/ 不进 Git），里面的 exam_done.json 也算“考过了”
  dry_run_name: final_exam_dry   # 开发赛季试跑放这里（开发模式，不算考试）
  backtest_first: 2005           # 回测从这个赛季连着跑到最后一个考试赛季，只给考试赛季打分（和 W9 同一个起点：gb_l7 每 91 天重训一次，
                                 # 从哪天开始数会改变重训日期，起点不同预测就不同；起点一样，开发赛季的预测应和 W9 一模一样，拿来核对）
  calibration_step: 0.1          # 第 5 条校准：每 0.1 一档
  dev_reference:                 # 开发赛季的数，只用来和考试结果并排看（第 1 条模型、第 3 条倾向）
    model_log_loss_2014_2023: 0.979      # 第 4 节步骤 6：gb_l7 2014–2023，T-24
    pinnacle_log_loss_2014_2023: 0.964
    lean_actual_mean:                    # W9 lean_thresholds.csv“实际的平均”（w = 1、现在的门槛，开发赛季 34,514 场）
      result: 0.291787
      draw: 0.043703
      over25: 0.173017
      btts: 0.123263
      ah: 0.066950

asia_study:                   # 日职、中超开发回测和平博收盘比 src/evaluate/asia_study.py（需求文档第 4 节“第 11 阶段”，跑之前写下）
  runs:                       # 每个联赛读哪几次回测（data/backtest/<名字>/，先用 src.evaluate.backtest 跑好）
    JPN: [j1_jpn_score, j1_jpn_gb]
    CHN: [j1_chn_score, j1_chn_gb]
  horizon: T-24               # 模型用哪个时点的预测
  benchmark: pinnacle_close   # 和哪个标杆比（平博收盘去水，时点“收盘”）
  metrics: [log_loss, brier, hit]   # 表里列哪几个分数（hit 越大越好，另外两个越小越好）
  min_season_n: 100           # 一季可比的场数少于这个，结论写“样本少”
  output: data/reports/日职中超_开发回测对比.md   # 报告放这里（data/ 不进 Git）
  five_league_reference:      # 五大联赛 2014/15–2023/24、T-24 的数（第 4 节步骤 5、步骤 6 结果），只用来并排看
    dyn_q1e5_b01: {model: 0.98187, pinnacle: 0.9643, n: 18085}
    gb_l7: {model: 0.97884, pinnacle: 0.96429, n: 18085}

second_study:                 # 次级联赛开发回测和平博收盘比，同一个程序 src/evaluate/asia_study.py --section second_study（需求文档第 4 节“第 11 阶段：次级联赛开发回测”，跑之前写下）
  title: 次级联赛开发回测：模型和平博收盘比
  # 每个联赛读哪几次回测。五个次级联赛在同一次回测里一起跑（梯度提升树用这几个联赛一起训练，和五大联赛一样）：
  #   python -m src.evaluate.backtest --leagues E1 SP2 D2 I2 F2 --first 2014 --last 2023 --models dyn_q1e5_b01 gb_l7 --horizons 24 --name l2_second_2014-2023
  runs:
    E1: [l2_second_2014-2023]
    SP2: [l2_second_2014-2023]
    D2: [l2_second_2014-2023]
    I2: [l2_second_2014-2023]
    F2: [l2_second_2014-2023]
  pooled:                     # 合在一起再算一次（组名: 包括的联赛）
    次级联赛合计: [E1, SP2, D2, I2, F2]
  models: [gb_l7, dyn_q1e5_b01]   # 算“差距之差”的模型（上线的 gb_l7 和它里面带的比分模型 dyn）
  horizon: T-24
  benchmark: pinnacle_close   # 平博收盘去水（按比例，backtest.benchmark_devig_method）
  metrics: [log_loss, brier, hit]
  min_season_n: 100           # 一季可比的场数少于这个，标“样本少”（和日职、中超一样）
  min_total_n: 1000           # 一个联赛合计少于这么多场，只列数、不下结论
  era_split: 2017             # 只看看：这个赛季以前 / 以后分开（次级联赛 2017/18 起才有射门数据）
  output: data/reports/次级联赛_开发回测对比.md   # 报告放这里（data/ 不进 Git）
  gap_reference:              # 和五大联赛比“差距之差”：同一段赛季、同样两个模型，在这个工作树里重跑一次
