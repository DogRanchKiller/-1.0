disagree_study:               # 模型和赔率意见不一样时谁准 src/evaluate/disagree_study.py（需求文档第 4 节“模型和赔率意见不一样时谁准”，跑之前写下，不临时加）
  # 读哪次开发回测：W9 那次（gb_l7，五大联赛 2005/06–2023/24，T-24）。三个文件从工作树 W9 原样复制到这里，sha256 见结果的 run_info.json（只读）。
  # 要 predictions.csv（gb_l7 和 pinnacle_close 的逐场概率）、fusion_odds.csv（经取数层取的 T-24 赛前赔率，已去水）、run_info.json
  base_dir: data/backtest/w9_gb_l7
  model: gb_l7                  # 比哪个模型（上线的 A 版）
  horizon: T-24                 # 模型用哪个时点
  close_model: pinnacle_close   # 只看看：平博收盘（去水后）在 predictions.csv 里叫什么
  odds_cols: [mo_p_home, mo_p_draw, mo_p_away]   # fusion_odds.csv 里赛前胜平负（去水后）的三列
  pinnacle_col: mo_pinnacle     # fusion_odds.csv 里“胜平负用的是不是平博”（1 / 0）
  gap_bins: [0.03, 0.06, 0.10]  # 分歧分四档的分界：3% 以内 / 3%–6% / 6%–10% / 10% 以上
  disagree_min: 0.03            # 分歧 ≥ 这个算“意见不一样”，分类都在这批比赛里比
  disagree_strong: 0.06         # 只看看：分歧 ≥ 这个的再比一次
  fav_bins: [0.45, 0.60]        # 两队强弱差距：赔率里最大的概率 < 45% 势均力敌 / 45%–60% 一方稍强 / ≥ 60% 强弱分明
  fav_labels: [势均力敌, 一方稍强, 强弱分明]       # 上面各档的名字，个数 = 分界个数 + 1（对不上程序会停下）
  draw_bins: [0.25, 0.28]       # 平局概率：< 25% 低 / 25%–28% 中 / ≥ 28% 高
  draw_labels: [平局概率低, 平局概率中, 平局概率高] # 上面各档的名字，个数 = 分界个数 + 1
  phase_rounds: 10              # 每个赛季前几轮算早期、最后几轮算后期
  period_split: 2014            # 两段：这个赛季以前 / 以后（gb_l7 的树的大小在 2005–2013 选的）
  n_tests: 27                   # 多重比较校正时算几个区间（分歧四档 4 + 8 类 23 组，需求文档里数过）
  sum_tol: 0.0001               # 读回来的三项概率加起来离 1 超过这么多就停下（csv 只存 6 位小数，四舍五入只会差 1e-6 左右）
  ll_tol: 0.0001                # 重算的模型 log loss 和回测记下的差超过这么多就停下（说明读错了列或文件不对）
  output_dir: data/backtest/disagree_study   # 结果放这里（data/ 不进 Git）

models:                    # 第 0 步模型 src/models（需求文档第 4 节步骤 0）
  min_matches: 200           # 拟合窗口里少于这么多场就不出预测（数据太少，猜的成分太大）
  frequency:                 # 历史频率基线：按联赛的主胜 / 平 / 客胜比例
    window_days: 1095        # 只看截止前最近 3 年（约 3 个赛季）的比赛。主场优势在变（2020/21 空场降到 40.8%），太久远的不用
  frequency_poisson:         # 按联赛的场均进球 → 独立泊松比分矩阵
    window_days: 1095
  elo:
    initial: 1500            # 一个联赛第一个有数据的赛季，所有队都从这个分开始
    k: 20                    # 每场赛后评分最多变多少（K 值）
    home_advantage: 65       # 主场加多少分再算“预期得分”
    goal_diff: false         # true：净胜球越多评分变得越多（K 乘一个系数）
    season_regression: 0.33  # 新赛季开始时，留队的球队把评分往联赛平均拉回这么多（1/3）
    promoted_default: -100   # 升班马的初始分 = 联赛平均 + 这个数；有往年升班马的记录后，改用往年升班马的平均
    promoted_history_seasons: 5  # 往年升班马的平均水平看最近几个赛季
    burn_in_seasons: 2       # 每个联赛有数据的头几个赛季评分还没稳定，不用来拟合“评分 → 概率”
    logit_window_days: 1825  # “评分 → 概率”（有序 logit）用截止前最近 5 年的比赛拟合
  # 事先写下要试的 Elo 设置（第 5 节：先写下要试哪几种，不临时加）。上面是默认组；这里每组只写和默认不同的数
  elo_variants:
    elo_k30: {k: 30}
    elo_gd: {goal_diff: true}
    elo_reg50: {season_regression: 0.5}
  # 第 4 节步骤 1–3：泊松、Dixon-Coles、DC + 负二项（src/models/goals.py）。下面是默认设置，三个模型共用
  goals:
    dc: false                # true：Dixon-Coles 修正 0:0、1:0、0:1、1:1 四个小比分
    nb: false                # true：进球数用负二项分布（比泊松多一个“离散度”，大比分可以更多）
    window_days: 1461        # 只用截止前最近 4 年的比赛拟合
    half_life_days: 365      # 时间衰减半衰期：1 年前的比赛算半场，2 年前算 1/4 场。null = 不衰减
    ridge: 3                 # 收缩：每队的进攻力、防守力往中心拉的力度（越大越往联赛平均拉）
    promoted_attack: -0.2    # 升班马先验的默认值（还没有往年升班马的拟合结果时用）：进攻力 −0.2 ≈ 进球少 18%
    promoted_defence: -0.2   # 防守力 −0.2 ≈ 丢球多 22%
    promoted_history_seasons: 3  # 升班马先验 = 最近 3 个赛季的升班马的平均
  # 事先写下要试的设置（第 5 节：先写下要试哪几种，不临时加；比较规则见需求文档第 4 节“步骤 1–3 事先定的比较”）
  goals_variants:
    # 步骤 1：泊松
    poisson: {}
    poisson_ridge1: {ridge: 1}
    poisson_ridge10: {ridge: 10}
    # 步骤 2：Dixon-Coles，和泊松同样设置 + 时间衰减的几种速度
    dc: {dc: true}
    dc_hl90: {dc: true, half_life_days: 90}
    dc_hl180: {dc: true, half_life_days: 180}
    dc_hl730: {dc: true, half_life_days: 730}
    dc_nodecay: {dc: true, half_life_days: null, window_days: 730}   # 不衰减：最近 2 年每场一样重
    # 步骤 3：DC + 负二项（衰减设置跟步骤 2 留下的那组一样，不另外试）。
    # 步骤 2 留下的是 dc（半衰期 365 天、窗口 4 年、收缩 3 = 上面的默认值），所以这里只开两个开关
    dcnb: {dc: true, nb: true}
    # 步骤 4（需求文档第 4 节“步骤 4 事先定的比较”）。target：拟合实力时“进球”用什么；two_stage：rho 另外只用真实比分拟合；
    # require：拟合只用这几类数据都齐的比赛（shots = 有射门、射正；understat = 有 Understat xG）。
    # 实验一（研究实验，只在开发模式）：五组都只用“有 Understat xG 和射门”的比赛拟合，只差在用什么数据、分不分两步
    e1_dc: {dc: true, usage: 研究实验}     # 平常的 dc（4 年窗口、全部比分），只作参考；用途要和同一次回测的其他组一样
    e1_goals: {dc: true, usage: 研究实验, require: [understat, shots]}
    e1_goals_2s: {dc: true, usage: 研究实验, require: [understat, shots], two_stage: true}
    e1_shots: {dc: true, usage: 研究实验, require: [understat, shots], target: shots}
    e1_xg: {dc: true, usage: 研究实验, require: [understat, shots], target: xg}
    e1_mix: {dc: true, usage: 研究实验, require: [understat, shots], target: mix}
    # 实验二（A版输入，能上线的）：dc 就是上面那组
    dc_2s: {dc: true, two_stage: true}     # 只用来解释“两步”本身的影响
    dc_shots: {dc: true, target: shots}
  # 第 4 节步骤 5：动态实力模型（src/models/dynamic.py，原理见文件开头）。下面是默认设置
  dynamic:
    q: 3.0e-5                # 每队 a、d 的方差每天加多少（越大 = 越相信实力变得快）
    q_league: 1.0e-6         # mu、主场优势的方差每天加多少（很小，几乎不变，不另外试）
    season_bump: 0           # 新赛季开始时，上赛季的队 a、d 的方差各加多少（休赛期转会、换帅）
    promoted_var: 0.1        # 升班马 a、d 的初始方差（标准差约 0.32）
    first_var: 0.1           # 联赛第一个赛季各队 a、d 的初始方差
    first_var_mu: 0.1        # 联赛第一个赛季 mu 的初始方差
    first_var_home: 0.05     # 联赛第一个赛季主场优势的初始方差
    first_goals: 1.35        # 联赛第一个赛季的初始场均进球（每队），mu = log 1.35
    first_home: 0.25         # 联赛第一个赛季的初始主场优势（e^0.25 ≈ 主队进球多 28%）
    promoted_attack: -0.2    # 升班马先验的默认值（还没有往年升班马的记录时用），和 dc 一样
    promoted_defence: -0.2
    promoted_history_seasons: 3  # 升班马先验 = 最近 3 个赛季的升班马在赛季结束时的平均
    burn_in_seasons: 2       # 每个联赛头两个赛季只用来让估计稳定，不出预测
    window_days: 1461        # 拟合 rho 用最近 4 年的比赛（赛前的预期进球 + 真实比分）
    half_life_days: 365      # 拟合 rho 的时间衰减，和 dc 一样
    per_match: true          # true：每场赛后马上更新；false：只在每周拟合时把新比赛算进去（对照组）
  # 事先写下要试的设置（需求文档第 4 节“步骤 5 事先定的比较”）：选的那段（2005–2013）里挑胜平负 log loss 最小的一组，
  # 再在评的那段（2014–2023）和 dc 比
  dynamic_variants:
    dyn_q1e5_b0: {q: 1.0e-5}
    dyn_q1e5_b01: {q: 1.0e-5, season_bump: 0.01}
    dyn_q3e5_b0: {q: 3.0e-5}
    dyn_q3e5_b01: {q: 3.0e-5, season_bump: 0.01}
    dyn_q1e4_b0: {q: 1.0e-4}
    dyn_q1e4_b01: {q: 1.0e-4, season_bump: 0.01}
    # dyn_weekly（对照组）：2005–2013 选出的 dyn_q1e5_b01 那组 q、b，只是改成每周更新一次（per_match: false）
    dyn_weekly: {q: 1.0e-5, season_bump: 0.01, per_match: false}
  # 第 4 节步骤 5 补充：每队自己的变化速度（src/models/adaptive.py，原理见文件开头）。默认设置：
  adaptive:
    base: dyn_q1e5_b01        # 每个候选 dyn 的其余设置都和这一组一样（步骤 5 选出的），只有 q 不一样
    candidates_q: [3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4]   # 几个候选的 q（一个赛季实力大约变 0.03、0.055、0.095、0.17）
    alpha: 0.98               # 权重每场先开 α 次方再归一（越小忘得越快；0.98 ≈ 35 场以前的表现剩一半分量）
    per_team: true            # true：每队一套权重；false：一个联赛共用一套（对照组）
  # 事先写下要试的设置（需求文档第 4 节“步骤 5 补充事先定的比较”）：2005–2013 选，2014–2023 和 dyn_q1e5_b01 比
  adaptive_variants:
    ada_a95: {alpha: 0.95}
    ada_a98: {alpha: 0.98}
    ada_a99: {alpha: 0.99}
    # ada_league（对照组）：2005–2013 选出的 ada_a99 那组 α，一个联赛共用一套权重（和 dyn_weekly 一样，选完才加）
    ada_league: {alpha: 0.99, per_team: false}
  # 梯度提升树的“联赛”特征给哪几组联赛编号（按代码排序编 0、1、2…，不在这里的联赛编 -1）。
  # 第 11 阶段加了 leagues.asia 以后，如果按全部联赛编号，五大联赛的编号会变，模型版本指纹也跟着变（上线的 gb_l7 会被当成新版本）。
  # 所以只给 top、second 编号，和加 asia 之前完全一样；日职、中超单独回测（一次一个联赛），联赛特征是常数，不影响
  gbdt_league_groups: [top, second]
  # 第 4 节步骤 6：特征表 + 梯度提升树（src/models/gbdt.py，原理见文件开头）。下面是默认设置
  gbdt:
    dyn: dyn_q1e5_b01         # 里面带的 dyn 用哪一组（步骤 5 选出的）
    elo: elo_gd               # 里面带的 Elo 用哪一组（步骤 0 最好的）
    pi: {lam: 0.035, gamma: 0.7, b: 10, c: 3, history_seasons: 3}   # pi-rating，原文的数，不调
    form: {windows: [5, 10, 20], half_lives: [5, 20], within_days: 365}   # 近期状态：最近几场、时间衰减半衰期（场）、只看多少天以内
    features: all             # all 全部特征 / nodyn 不给 dyn 的特征 / dynonly 只给 dyn 的特征（加联赛、主客场）
    target: goals             # goals 预测每队进球（泊松）/ result 直接预测胜平负（多分类，只作对照）
    num_leaves: 15            # 每棵树最多几片叶子（越多越复杂）
    min_data_in_leaf: 100     # 每片叶子至少几行（越多越不容易“背答案”）
    learning_rate: 0.03       # 每棵树的修正打几折（越小越稳，要的树越多）
    feature_fraction: 0.8     # 每棵树随机用 80% 的特征
    bagging_fraction: 0.8     # 每棵树随机用 80% 的行
    lambda_l2: 1.0            # L2 正则：叶子上的数往 0 拉的力度
    max_rounds: 2000          # 最多种几棵树
    early_stopping_rounds: 50 # 验证集损失连续这么多棵不降就停
    valid_days: 365           # 训练数据里最后多少天当验证集（只用来定种几棵树）
    retrain_days: 91          # 每隔几天重新训练一次树（特征每场赛后都更新）
    min_train_rows: 2000      # 训练行数少于这么多就不训练、不出预测
    seed: 20261031            # 随机种子：每次运行结果一样
  # 事先写下要试的设置（需求文档第 4 节“步骤 6 事先定的比较”）：2005–2013 选，2014–2023 和 dyn_q1e5_b01 比
  gbdt_variants:
    gb_l7: {num_leaves: 7, min_data_in_leaf: 200}
    gb_l15: {num_leaves: 15, min_data_in_leaf: 100}
    gb_l31: {num_leaves: 31, min_data_in_leaf: 50}
    # 对照组（2005–2013 选出 gb_l7 以后加的，树的大小都和 gb_l7 一样；需求文档第 4 节“步骤 6 怎么做”）
    gb_nodyn: {num_leaves: 7, min_data_in_leaf: 200, features: nodyn}      # 不给 dyn 的特征
    gb_1x2: {num_leaves: 7, min_data_in_leaf: 200, target: result}        # 直接出胜平负三个概率
    gb_dynonly: {num_leaves: 7, min_data_in_leaf: 200, features: dynonly}  # 只给 dyn 的特征（加联赛、主客场）
    # 步骤 7 伤停研究（需求文档第 4 节“步骤 7 怎么做”）：用途都是“研究实验”（只在开发模式），一次回测里的用途要一样
    gb_l7_r: {num_leaves: 7, min_data_in_leaf: 200, usage: 研究实验}                     # 和 gb_l7 一样，只是用途不同（对照组）
    gb_inj: {num_leaves: 7, min_data_in_leaf: 200, usage: 研究实验, extra: [inj]}         # 加伤停六个特征
    gb_val: {num_leaves: 7, min_data_in_leaf: 200, usage: 研究实验, extra: [val]}         # 只加身价差（对照，只报告）
    gb_inj_val: {num_leaves: 7, min_data_in_leaf: 200, usage: 研究实验, extra: [inj, val]} # 两样都加（只报告）
    # xG 研究第 1 段（需求文档第 4 节“xG 研究第 1 段怎么做”）：dyn 的更新用 0.5 × 进球 + 0.5 × Understat xG，对照组是上面的 gb_l7_r
    gb_xg_r: {num_leaves: 7, min_data_in_leaf: 200, usage: 研究实验, xg_mix: 0.5}
    # xG 研究第 2 段（需求文档第 4 节“xG 研究第 2 段怎么做”）：同样的做法，xG 用数据库比赛统计里的（懂球帝 / football-data），
    # 用途 A版输入。2026-11-07 起是上线模型（preview.model）；gb_l7 反过来当影子模型并排出 T-24（见 shadow 段）
    gb_xg: {num_leaves: 7, min_data_in_leaf: 200, xg_mix: 0.5, xg_source: match_stats}
    # 步骤 8 B 版（需求文档第 4 节“步骤 8 怎么做”）：用途都是“B版输入”，一次回测里的用途要一样；另一组 market_pre 见 models.market_variants
    gb_l7_b: {num_leaves: 7, min_data_in_leaf: 200, usage: B版输入}                        # 和 gb_l7 一样，只是用途不同（核对）
    gb_b: {num_leaves: 7, min_data_in_leaf: 200, usage: B版输入, extra: [odds]}            # gb_l7 + 赔率特征（B 版）
    gb_mkt: {num_leaves: 7, min_data_in_leaf: 200, usage: B版输入, extra: [odds], features: mktonly}  # 只用联赛、主客场 + 赔率特征（对照）
  # 直接出赛前赔率去水后的胜平负（不训练），步骤 8 的主比较对象；用途和 B 版一样
  market_variants:
    market_pre: {usage: B版输入}

# 维基百科：杯赛、欧战赛程（需求文档 6.1、第 18 节待定问题 5，你选了方案 a）
# robots.txt 不允许程序访问 /w/（包括 api.php）和 /api/（REST API），只欢迎“低速、友好”的程序看 /wiki/条目名 的页面。
# 所以下载程序只请求 https://en.wikipedia.org/wiki/条目名（不带问号参数），一次一个，间隔下面的秒数。
wikipedia:
  base_url: https://en.wikipedia.org/wiki/
  user_agent: "FootballLearningProject/0.1 (personal study; https://github.com/DogRanchKiller/-1.0) python-requests"
  min_interval_seconds: 3     # 两次请求之间至少隔几秒
  retry_waits: [30, 120, 600] # 失败（连不上 / 5xx）后等几秒再试；429 按网站给的 Retry-After 等
  first_season: 2000          # 最早下载哪个赛季（2000 = 2000/01）
  max_subpages: 15            # 一个赛事一个赛季最多跟进几个子页面（防止链接越跟越多）
  # 子页面：主页面里链接到“主页面标题 + 空格 + ……”的页面（例如 “2008–09 UEFA Cup group stage”）。
  # “……”部分（小写后）符合下面任何一条规则（正则表达式）的不跟进：决赛单场页（主页面里已经有）、名单、统计等
  skip_subpages: ['^final$', 'squads', 'statistics', 'broadcast', 'disciplinary', 'top ?scorers', 'preliminary rounds',
                  'women', 'frauen', 'féminine', 'femenina', 'water polo', 'serie c', 'serie d', 'lega pro', 'dilettanti']
  # 清洗时也按 skip_subpages 跳过这些页面（第一次下载时还没有女子、低级别赛事这几条规则，那时下载的页面留在原始层，但不导入）。
  # 法国杯第 7 轮以前是业余球队的地区赛（我们的球队从第 7、8 轮才参加），这些页面也不导入：
  import_skip_pages: ['coupe de france (qualifying rounds|preliminary round|[1-6](st|nd|rd|th) (round|through))']
  # 每个赛事：代码 → 名称、页面标题。标题里 {season} = “2008–09” 这种写法，{year} = 赛季开始年份。
  # 一个赛事可以有几种标题（改过名），按 [第一个赛季, 最后一个赛季, 标题] 写；同一赛季有几种就依次试。
  # 重赛: true = 平局要重赛（英足总杯）：同一轮同一对球队的第二场是重赛，不是第 2 回合。
  # 单场: true = 超级杯，一年一场（西班牙 2019/20 起是四队小赛会），赛季按比赛日期算。
  # skip_subpages_extra：这个赛事另外不跟进的子页面（规则写法同上。例如足总杯资格赛：几百场业余比赛，我们的球队不参加）
  competitions:
    UCL:  {名称: 欧冠, 国家: 欧洲, titles: [[2000, 2100, "{season} UEFA Champions League"]]}
    UEL:  {名称: 欧联（2008/09 以前叫联盟杯）, 国家: 欧洲,
           titles: [[2000, 2008, "{season} UEFA Cup"], [2009, 2100, "{season} UEFA Europa League"]]}
    UECL: {名称: 欧协联, 国家: 欧洲,
           titles: [[2021, 2023, "{season} UEFA Europa Conference League"], [2024, 2100, "{season} UEFA Conference League"]]}
    FAC:  {名称: 英足总杯, 国家: 英格兰, 重赛: true, titles: [[2000, 2100, "{season} FA Cup"]], skip_subpages_extra: [qualifying rounds]}
    ELC:  {名称: 英联赛杯, 国家: 英格兰,
           titles: [[2000, 2015, "{season} Football League Cup"], [2016, 2100, "{season} EFL Cup"]]}
    DFB:  {名称: 德国杯, 国家: 德国, titles: [[2000, 2100, "{season} DFB-Pokal"]]}
    CI:   {名称: 意大利杯, 国家: 意大利, titles: [[2000, 2100, "{season} Coppa Italia"]]}
    CDR:  {名称: 国王杯, 国家: 西班牙, titles: [[2000, 2100, "{season} Copa del Rey"]]}
    CDF:  {名称: 法国杯, 国家: 法国, titles: [[2000, 2100, "{season} Coupe de France"]]}
    CDL:  {名称: 法国联赛杯（2019/20 后停办）, 国家: 法国, titles: [[2000, 2019, "{season} Coupe de la Ligue"]]}
    # 超级杯：一年一场（西班牙 2019/20 起四队），页面标题用年份。赛季按比赛日期算（7 月起算新赛季）
    UESC: {单场: true, 名称: 欧洲超级杯, 国家: 欧洲, titles: [[2000, 2100, "{year} UEFA Super Cup"]]}
    ECS:  {单场: true, 名称: 英格兰社区盾杯, 国家: 英格兰, titles: [[2000, 2001, "{year} FA Charity Shield"], [2002, 2100, "{year} FA Community Shield"]]}
    DSC:  {单场: true, 名称: 德国超级杯, 国家: 德国, titles: [[2010, 2100, "{year} DFL-Supercup"]]}
    # 维基百科改过标题写法：意大利超级杯 2025 起用 “2025–26”；西班牙超级杯 2024/25 起用比赛那年（2025 年 1 月踢 → “2025”）。
    # {next_year} = 赛季开始年份 + 1
    ISC:  {单场: true, 名称: 意大利超级杯, 国家: 意大利, titles: [[2000, 2024, "{year} Supercoppa Italiana"], [2025, 2100, "{season} Supercoppa Italiana"]]}
    SSC:  {单场: true, 名称: 西班牙超级杯, 国家: 西班牙, titles: [[2000, 2018, "{year} Supercopa de España"], [2019, 2023, "{season} Supercopa de España"],
                                              [2024, 2100, "{next_year} Supercopa de España"]]}
    FSC:  {单场: true, 名称: 法国超级杯, 国家: 法国, titles: [[2000, 2100, "{year} Trophée des Champions"]]}

# 交叉核对用的两个开放数据集（只用来检查维基百科解析得对不对，不导入数据库）。
# 都在 GitHub 上（raw.githubusercontent.com 没有 robots.txt 限制）。文件不大，每个只下载一次。
#   engsoccerdata（GPL 许可，R 语言数据包）：英足总杯、英联赛杯、欧冠的历史比分
#   openfootball（CC0 公有领域）：欧冠 / 欧联 / 欧协联、各国杯赛，纯文本 Football.TXT 格式
crosscheck:
  user_agent: "FootballLearningProject/0.1 (personal study; https://github.com/DogRanchKiller/-1.0) python-requests"
  min_interval_seconds: 3
  retry_waits: [30, 120, 600]
  engsoccerdata:
    base_url: https://raw.githubusercontent.com/jalapic/engsoccerdata/master/data-raw/
    files: {UCL: champs.csv, FAC: facup.csv, ELC: leaguecup.csv}
  openfootball:
    base_url: https://raw.githubusercontent.com/openfootball/
    # 赛事代码 → [仓库, 文件名, 第一个赛季, 最后一个赛季]；网址 = base_url + 仓库/master/2018-19/文件名
    files:
      UCL:  [champions-league, cl.txt, 2011, 2025]
      UEL:  [champions-league, el.txt, 2020, 2024]
      UECL: [champions-league, conf.txt, 2021, 2024]
      FAC:  [england, facup.txt, 2018, 2024]
      ELC:  [england, eflcup.txt, 2018, 2024]
      DFB:  [deutschland, cup.txt, 2018, 2025]
      CDR:  [espana, cup.txt, 2020, 2024]
      CI:   [italy, cup.txt, 2020, 2024]

# ---------- 赛前积分榜和复盘自动标签（第 1 阶段，需求文档第 15 节“标签和备注”） ----------
standings:
  rules: config/league_rules.yaml           # 各联赛积分规则、同分排名规则、降级 / 争冠名额（每条写了来源）
  deductions: config/points_deductions.yaml # 扣分记录（football-data 没有扣分，手工录入，每条写来源）
  # 哪些联赛组有积分规则、能算积分榜和复盘标签。日职、中超（asia）没写规则：赛季是自然年（season_window 按 7 月切），
  # 降级名额每年变、还有附加赛，没核对过来源前不算，免得给出错的“保级战”标签
  league_groups: [top, second]

labels:
  derbies: config/derbies.yaml   # 德比对阵名单
  output_dir: data/labels        # 算好的标签存在这里（data/ 不进 Git），每个联赛一个文件
  # 赛前积分榜按“开球前多少小时”截止。0 = 开球那一刻：只算开球前已经知道比分的比赛（复盘用）。
  # 以后要当模型特征，改成预测时点（24 / 6 / 1），和 T-24 / T-6 / T-1 一致。
  cutoff_hours_before_kickoff: 0
  race:                          # 争冠战 / 保级战（定义见 src/review/labels.py 开头）
    last_rounds: 10              # 只看赛季最后几轮：每队分开看，这场赛前它自己的剩余场次（含本场）≤ 这个数
    gap_points: 6                # 和关键名次的分差不超过几分（还要剩余场次在数学上追得上）

standings_check:                 # 用维基百科赛季最终积分榜核对（src/review/standings_check.py）
  raw_dir: data/raw/wikipedia/standings
  first_season: 1993
  last_season: 2025              # 2026/27 还没踢完，不核对

# 定时任务的心跳文件（src/jobs/heartbeat.py，需求文档第 9 节“完整链路的分工和接口”）
jobs:
  state_dir: data/jobs           # 每个定时任务一个 <任务名>.json：上次开始、结束、成功没有、摘要（data/ 不进 Git）

# 定时预测 src/predict/scheduled.py（需求文档第 9 节“定时出 T-24 / T-6 / T-1 预测”）
schedule:
  horizons: [24, 6, 1]          # 预测时点：开球前几小时（T-24 / T-6 / T-1）
  lock_file: data/jobs/scheduled_predict.lock   # 锁文件：防止两次运行重叠（data/ 不进 Git）
  lock_stale_minutes: 60        # 锁文件超过这么多分钟没更新，视为残留锁，先清掉再拿
  matrix_decimals: 6            # 比分矩阵存档精度（每格几位小数）

# 影子预测 src/predict/shadow.py（需求文档第 4 节“xG 研究第 2 段怎么做”）：定时预测存了 T-24 以后，
# 用同一个截止时间给这些比赛再出一份别的模型，存进 shadow_predictions 表（不进 predictions，网站、融合、推送、复盘都不读它）
shadow:
  enabled: true                 # false = 不出影子预测（退回原样）
  models: [gb_l7]               # 并排出哪几个模型（models 段里的名字）。2026-11-07 上线换成 gb_xg 以后，原来的 gb_l7 在这里接着出；不能和 preview.model 一样
  kinds: [T-24]                 # 主预测存了哪几个时点才跟着出
  output_dir: data/backtest/xg_shadow   # 对比报告 src/evaluate/xg_shadow.py 的结果（data/ 不进 Git）
  min_matches: 1000             # 踢完的少于这么多场：只列数，不算区间、不下结论

# 逐场流程验收：只读存档和复盘，沿用 site 的前后天数、preview 的联赛/模型。
# 起点来自首次真实正式预测的截止时间；之前的计划时点不追认成系统漏跑。
# 宽限只决定“等下一轮调度”还是“逾期”，实际晚了哪怕几秒仍显示迟到。
lifecycle:
  enabled_since_utc: "2026-11-02 01:47:37"
  grace_minutes: 20             # 现有15分钟轮询加5分钟计算缓冲，不改变预测时间或补造存档
  score_tolerance: 0.0000011    # scores.csv 六位小数的读取误差，不作为模型精度门槛

# ---------- 赛后对账、单场复盘、周报月报（工作树 K2，src/review/reconcile.py 等，需求文档第 15 节、第 9 节接口 3） ----------
# 只用来记录和展示，不会反过来改模型、融合、倾向、信心等级的任何参数。
review:
  output_dir: data/review        # 输出文件夹（data/ 不进 Git）：scores.csv、matches/<match_id>.json、reports/*.md，每次全部重算
  # 预测版本的显示顺序（信息从少到多）；表里出现别的 kind 也照样对账，排在最后
  kinds: [T-24, T-6, T-1, preview]
  # 每个模型版本分别选择“正式成绩”（第 15 节：T-1 为准）；按顺序取该模型版本有的第一个，不合并不同模型版本
  official_order: [T-1, T-6, T-24, preview]
  # 两家收盘标杆独立保留、分别比较；1x2 与大小2.5各用自己的同场交集，没有合格证据就留空
  close_bookmakers: [平博 Pinnacle, 多家平均]
  close_devig_method: proportional  # 收盘赔率去水方法（和 backtest.benchmark_devig_method 一样用按比例）
  # 存档里的概率是 4 位小数，三个加起来可能差 0.0001 左右；差得比这个多就当这一行坏了，不对账（摘要里记下）
  prob_sum_tol: 0.001
  # 取比分、xG、红牌时从这一联赛最早一场要复盘的比赛往前多看几天（改期提前的比赛也能找到）
  stats_margin_days: 3
  # 单场误差归类（第 15 节“误差原因怎么归类”）
  errors:
    miss_below: 0.334            # 正式那一版给实际结果的概率低于这个（约三分之一）才算“明显没料到”，才归类
    close_move: 0.05             # 收盘时实际结果的概率比出预测时的赔率高这么多（5 个百分点）以上 → 信息缺失型
    direction_min: 0.01          # “赔率往模型的方向走”：变动小于 1 个百分点算“基本没动”
    xg_margin: 0.5               # 两队 xG 差小于这个算“xG 看是平局”；大于等于算 xG 支持多的那队
  reports:
    min_matches: 300             # 少于这么多场写“样本太少，不能下结论”（第 5 节：真实成绩要几百场以上才下结论）
    top_misses: 5                # 每份报告列几次最大的失误
# 正式网站的静态页面（src/web/site/ + src/jobs/build_site.py，需求文档第 8 节“正式网站（静态页面）实际做法”，工作树 K3）
# 只读数据库、预测存档（predictions 表）、data/review/（K2 生成），不出预测、不跑模型、不联网
site:
  output_dir: data/site          # 生成到这里（data/ 不进 Git）；每次整站重新生成，先写到旁边的临时文件夹再替换
  review_dir: data/review        # 赛后对账、复盘结果（需求文档第 9 节接口 3，K2 写）
  leagues: top                   # 首页列哪一组联赛（leagues 段里的 top 五大联赛）
  days_ahead: 7                  # 首页列未来几天开球的比赛
  days_back: 3                   # 首页另列最近几天已经开球的比赛（看比分、看复盘）
  team_days_back: 60             # 球队页列最近多少天的赛程（联赛 + 杯赛、欧战）
  team_days_ahead: 14            # 球队页列未来多少天的联赛赛程
  # 球队页的四块（需求文档第 8 节“球队数据页怎么算”，工作树 TEAM）：
  team_form_matches: 6           # 近期状态列最近几场联赛（Elo 那张表也列这几场）
  team_h2h_matches: 10           # 历史交锋列两队最近几场联赛交锋（对手 = 接下来第一场联赛的对手）
  team_elo_matches: 38           # Elo 折线图画现在这个联赛最近几场（38 ≈ 英超一个赛季）
  team_skip_league_groups: [intl, jc] # 球队页四块不读这些联赛组（国际赛：国家队不在网站上；竞彩联赛只给虚拟实盘用。读了只会变慢）
  versions: [T-24, T-6, T-1, preview]   # 单场页对比哪几个版本（predictions 表的 kind），按这个顺序排
  heatmap_goals: 5               # 比分热力图显示 0–5 球（第 3 节：0-0 到 5-5）；更多的并进“6+”
  top_scores: 5                  # 列最可能的几个比分
  ou_lines: [1.5, 2.5, 3.5]      # 大小球除了主盘口，另外列这几条线
  ah_extra: [-0.5, -0.25, 0.25, 0.5]   # 亚盘除了主盘口，另外列主盘口加减这几个数的线
  matrix_sum_tol: 0.001          # 存档里的矩阵是 6 位小数，加起来和 1 差这么多以内按比例补成 1；差更多就当矩阵坏了，不用
  refresh_minutes: 15            # 页面开着时多少分钟自己重新加载一次（和定时任务“足球预测_生成网站”的间隔一样）
  story_move_min: 0.01           # 单场页“盘口与水位解读”：胜平负概率变得最多的那项不到 1 个百分点就写“基本没动”（只是措辞，不影响预测）
  record_matches: 60             # 战绩页“每场四个预测”列最近多少场（命中率汇总照样算全部）
  # 虚拟投注页 bots.html 读哪一次机器人历史回测的结果（src/web/site/bots.py，需求文档第 8 节、第 14 节）。
  # 只读 summary.csv、by_season.csv、by_period.csv、bankroll.csv、check.json，不读每注明细 bets.csv；文件不在时页面写“还没有结果”
  # 2026-11-07 用户定换成新时间规则重跑的 bots_v1_tc（需求文档第 14 节、v1.26）；旧规则的 bots_v1 文件留着没删
  bots_dir: data/backtest/bots/bots_v1_tc
  # 网站显不显示“信心等级”（●●● 高 / ●●○ 中 / ●○○ 低）。现在实时预测都有赔率、降级因素是空的，每场都是 ●●● 高，
  # 显示出来没有区分作用，2026-11-07 用户定先藏起来（需求文档第 8 节、v1.21）。只是不显示，存档里的等级照样存
  show_confidence: false

# 盘口联动观察页 odds_lead.html（src/web/site/odds_lead.py，需求文档第 8 节“盘口联动观察页怎么算”，写程序之前写下）。
# 只是观察“赔率明显变动时哪家公司先变、哪家跟着变”，不是预测，不进模型
odds_lead:
  since: "2026-10-30 18:12"     # 我们自己的懂球帝快照从这时开始（UTC；以前回补的只有初盘和最新两个点，看不出谁先变）
  window_hours: 48              # 看开球前多少小时的变动；开球要晚于 since + 这么多小时，整个窗口才都在快照里
  min_move: 0.02                # 市场线（各家的中位数）变了至少这么多（2 个百分点）才算“明显变动”
  min_books: 5                  # 窗口开始时至少要有几家公司有价格
  tolerance_hours: 1            # 比市场早这么多小时以上走到一半 = 先变，晚这么多以上 = 晚变，中间 = 一起变
  min_matches: 10               # 一家公司算进来不到这么多场，只写场数，不排位置、不下结论
  recent_rows: 20               # 页面列最近多少次明显变动

# 四个玩法的预测和命中率 picks_v2（src/web/site/picks.py、src/evaluate/picks_reference.py，需求文档第 3 节“四个玩法的预测和命中率”，
# 算命中率之前写下）。想改规则另起一版，旧的照留（picks_v1 比分只给 1 个，picks_v2 给 4 个，别的一样）
picks:                           # 规则名写在 src/web/site/picks.py 的 RULE、比分几个写在 SCORE_TOP（历史参考文件里也记着规则名，对不上不用）
  reference_dir: data/backtest/picks_reference   # 历史参考（期末考试存下的结果按同一规则算，只是描述统计）放这里的 <规则名>/ 下面；picks_v1 的在这个文件夹本身
  reference_run: final_exam      # 用哪一次回测存下的结果（data/backtest/<这个>/）

# 四个玩法的预测 picks_v3：把握等级上网站（src/web/site/picks.py 的 v3 部分，需求文档第 5 节“四个玩法的预测 picks_v3”，写代码之前写下）。
# 数字全部照抄 SEL 的结果 data/backtest/pick_tiers/summary.json（“市场”那一块），不重新调。picks_v2 照留，战绩页照旧按 picks_v2 算
picks_v3:
  ou_lines: [0.5, 6.0, 0.25]     # 大小球主盘口可用的线：0.5 到 6，每隔 0.25（存档的主盘口不在里面就不用；推主盘口时也只试这些线）
  cut_seasons: [2012, 2019]      # 切点用这几季定的（三等分点）
  test_seasons: [2020, 2023]     # 下面的命中率是这几季的（检验季）
  test_n: 7228                   # 检验季几场（五大联赛，开球前 24 小时那一版）
  tiers:                         # 每个分档的玩法：cuts = [下切点, 上切点]（把握分 ≥ 上 = 高，≥ 下 = 中，其余 = 低）；
                                 # high/mid/low = 检验季这一档的 rate 命中率、n 场数、mean_p 平均写的可能性；all = 这个玩法全部的命中率
    1x2:
      cuts: [0.447, 0.574]
      high: {rate: 0.6943, n: 2388, mean_p: 0.6794}
      mid: {rate: 0.5122, n: 2380, mean_p: 0.5061}
      low: {rate: 0.4085, n: 2460, mean_p: 0.3998}
      all: {rate: 0.5371, n: 7228}
    ou:
      cuts: [0.512, 0.524]
      high: {rate: 0.5285, n: 2021, mean_p: 0.5297}
      mid: {rate: 0.5105, n: 2548, mean_p: 0.5180}
      low: {rate: 0.4966, n: 2659, mean_p: 0.5061}
      all: {rate: 0.5103, n: 7228}
    score:
      cuts: [0.405, 0.443]
      high: {rate: 0.4890, n: 1636, mean_p: 0.4726}
      mid: {rate: 0.4567, n: 2284, mean_p: 0.4232}   # 写出来偏低（不准）：页面以实际命中率为准，旁边写明
      low: {rate: 0.3836, n: 3308, mean_p: 0.3748}
      all: {rate: 0.4305, n: 7228}
  ah_all: {rate: 0.5285, n: 7228}   # 让球分不开，不分档，只写这个总的历史命中率
  calib_tol: 0.03                # 平均写的可能性和实际命中率差超过这个，页面上写明“写出来偏低 / 偏高”（和 pick_tiers_study.calib_tol 一样）
  model_overstated:              # “模型自己”一列让球、大小球写高了（模型自己高档：写的胜算 → 实际命中率），页面上只写方向，旁边写这两个数
    ah: {written: 0.6106, actual: 0.4988}
    ou: {written: 0.5740, actual: 0.5058}

# 局域网网站：带登录的网站服务器 src/web/serve.py（需求文档第 8 节“局域网网站”、第 16 节“安全”，工作树 W1）
# live.dynamic 是 true 时登录后的网页现读现出（只读方式读数据库，见下面 live:）；false 时只发 site.output_dir 里生成好的网页。
# 另外发 paths.reports 里的 status.html。live.live_poller 关着时不联网。只在局域网用，不对公网开放
site_server:
  host: 0.0.0.0                  # 监听哪个地址：0.0.0.0 = 这台电脑的所有网卡（同一个 Wi-Fi 的手机才连得进来）；127.0.0.1 = 只有本机
  port: 8790                     # 网址里冒号后面的数字；防火墙规则也只放行这个端口。改了要重新双击“开启局域网访问.bat”
  state_dir: data/site_server    # 密码哈希 credentials.json、会话 sessions.json、给你看的 网站地址和密码.txt（data/ 不进 Git）
  status_page: status.html       # /status 发的是 paths.reports 下的这个文件（数据状态页）
  log_file: logs/site_server.log # 访问日志：只记时间、IP、方法、路径、状态码，不记密码和 cookie
  log_max_bytes: 1000000         # 日志满 1 MB 换一个新文件
  log_backups: 3                 # 旧日志留几个
  username: admin                # 登录账号（固定一个）
  # 密码哈希：PBKDF2-SHA256 迭代次数。OWASP 2023 年的建议是 60 万次；每次登录多算约零点几秒，换来猜密码慢得多。
  # 存进 credentials.json 时把次数一起存下，以后改这个数，旧密码照样能验证
  pbkdf2_iterations: 600000
  password_groups: 4             # 自动生成的密码：几组
  password_group_len: 4          # 每组几个字符（小写字母和数字，去掉容易看错的 0 o 1 l i）
  min_password_length: 8         # 自己改密码时最短几位
  session_days: 30               # 登录一次能用多少天（手机不用每次登）
  max_sessions: 50               # 最多同时有多少个登录（超出时先挤掉最早的）
  max_failures: 5                # 同一个 IP 连续输错几次锁定
  lockout_minutes: 15            # 锁定多少分钟
  max_login_body_bytes: 4096     # 登录表单最多收多少字节（防止有人发很大的数据把服务器卡住）
  request_timeout_seconds: 20    # 一个连接多少秒没动静就断开
  max_connections: 32            # 最多同时处理几个连接，满了新连接直接关掉（防止慢速连接把服务器拖垮）
  firewall_rule: 足球预测_局域网网站   # Windows 防火墙规则名（开启局域网访问.bat 加、关闭局域网访问.bat 删）
  task_name: 足球预测_网站服务       # 开机自动运行的定时任务名（register_tasks.ps1 登记）

# 虚拟投注机器人的历史回测 bots_v1（src/bots/、src/evaluate/bot_backtest.py，需求文档第 14 节“历史回测第一版规则 bots_v1”，跑之前写下）
# 跑完不改这一段的数来调结果；想改规则就另起一版（例如 bots_v2），旧的结果照留。全是虚拟投注，不连任何账户。
bots:
  version: bots_v1               # 规则版本名，也是输出子文件夹名
  output_dir: data/backtest/bots # 结果放这里（data/ 不进 Git）
  run: tc_fix_gb_l7              # 用哪次回测的概率（data/backtest/ 下的文件夹，要有 predictions.csv 和 matrices_<模型>.npz）。
                                 # 2026-11-07 起用新时间规则那次（v1.12；gb_l7 的预测和 w9_gb_l7 逐场一样，只是那边没存比分矩阵）
  model: gb_l7
  horizon: T-24                  # 下注时点 = 开球前 24 小时（和概率同一个时点）
  hours_before_kickoff: 24
  leagues: [E0, SP1, D1, I1, F1]
  first_season: 2005             # 只用开发赛季（2005/06–2023/24）；最后一季程序里按 seasons.dev_last 检查，不能跨进考试赛季
  last_season: 2023
  usage_bet: 机器人下注          # 下注时取赔率的用途（数据字典）
  usage_settle: 机器人结算       # 结算时取比分、收盘赔率的用途
  settle_after_kickoff_hours: 72 # 结算“站在”开球后几小时（和 backtest.eval_after_kickoff_hours 一样）
  odds_source: football-data
  price_books:                   # 两种下注价格：名字 → 公司（odds 表的写法）和倒数之和的正常范围用 quality.overround 的哪一档
    平博: {bookmaker: 平博 Pinnacle, overround: 1x2}
    最高: {bookmaker: 多家最高, overround: best}
  fusion_books: [平博 Pinnacle, 多家平均]   # 融合概率（w = 1）用哪家赛前胜平负，按顺序选（和 market_odds.result_books 一样）
  clv_bookmaker: 平博 Pinnacle   # CLV 用这家的收盘胜平负
  devig_method: proportional     # 融合概率、CLV、随机机器人理论值都按比例去水
  random_seed: 20261101          # 随机机器人的种子：每场用（种子, match_id）定选哪个，重跑结果一样
  bankroll: 10000                # 初始虚拟资金
  flat_stake: 100                # 固定注额（初始资金的 1%）
  kelly_fraction: 0.25           # 四分之一凯利
  kelly_cap: 0.05                # 凯利类单注最多资金的 5%
  flat_cap: 0.02                 # 资金模拟：固定注额类单注最多当前资金的 2%
  daily_cap: 0.20                # 资金模拟：同一天（截止时间的 UTC 日期）合计最多当天第一注时资金的 20%
  stop_drawdown: 0.30            # 资金模拟：从最高点回撤超过 30% 就停
  min_clv_bets: 300              # 有 CLV 的注至少这么多才进排行榜
  period_split: 2012             # 两段分开报告：这个赛季之前（没有平博）/ 这个赛季起
  # 机器人：rule 怎么选（random 随机 / favorite 热门 / home 主队 / top 概率最高 / value 期望收益过门槛），
  # prob 概率来源（model 模型 / fusion 融合），book 价格（上面 price_books 的名字），edge 期望收益门槛，stake flat 固定 / kelly 四分之一凯利
  list:
    - {name: 对照_随机_平博, rule: random, book: 平博, stake: flat, control: true}
    - {name: 对照_随机_最高, rule: random, book: 最高, stake: flat, control: true}
    - {name: 对照_热门_平博, rule: favorite, book: 平博, stake: flat, control: true}
    - {name: 对照_热门_最高, rule: favorite, book: 最高, stake: flat, control: true}
    - {name: 对照_主队_平博, rule: home, book: 平博, stake: flat, control: true}
    - {name: 对照_主队_最高, rule: home, book: 最高, stake: flat, control: true}
    - {name: 跟模型_平博, rule: top, prob: model, book: 平博, stake: flat}
    - {name: 跟模型_最高, rule: top, prob: model, book: 最高, stake: flat}
    - {name: 模型价值3_平博, rule: value, prob: model, book: 平博, edge: 0.03, stake: flat}
    - {name: 模型价值5_平博, rule: value, prob: model, book: 平博, edge: 0.05, stake: flat}
    - {name: 模型价值8_平博, rule: value, prob: model, book: 平博, edge: 0.08, stake: flat}
    - {name: 模型价值3_最高, rule: value, prob: model, book: 最高, edge: 0.03, stake: flat}
    - {name: 模型价值5_最高, rule: value, prob: model, book: 最高, edge: 0.05, stake: flat}
    - {name: 模型价值8_最高, rule: value, prob: model, book: 最高, edge: 0.08, stake: flat}
    - {name: 融合价值3_最高, rule: value, prob: fusion, book: 最高, edge: 0.03, stake: flat}
    - {name: 融合价值5_最高, rule: value, prob: fusion, book: 最高, edge: 0.05, stake: flat}
    - {name: 融合价值8_最高, rule: value, prob: fusion, book: 最高, edge: 0.08, stake: flat}
    - {name: 模型凯利_最高, rule: value, prob: model, book: 最高, edge: 0.03, stake: kelly}
    - {name: 融合价值凯利_最高, rule: value, prob: fusion, book: 最高, edge: 0.03, stake: kelly}

# 推送出口和定时任务监控（K5：src/notify/、src/jobs/notify.py，需求文档第 9 节“推送：已定的做法”）
# 推送渠道 2026-11-01 定为 pushplus（推送加）微信公众号渠道。口令（token）放 config/secrets.yaml 的 pushplus.token，不进 Git
notify:
  outbox_dir: data/notify/outbox      # 要推的消息，一条一个文件（接口 5）。发完挪到同级的 sent/，最终失败挪到 failed/
  state_file: data/notify/state.json  # 记“哪些预测推过了、哪些故障正在提醒、最近发了几条”（data/ 不进 Git）
  api_url: https://www.pushplus.plus/send   # pushplus 的发送接口
  channel: wechat                     # 发到微信公众号
  template: markdown                  # 正文按 Markdown 排版
  request_timeout_seconds: 20         # 一次发送最多等几秒，超过算“网络不通”
  # 频率：pushplus 写的是“1 分钟 5 次、实名用户微信渠道每天 200 次、超额会被限制账号”。都取保守值：
  # 每分钟 4 条（留 1 条余地，电脑时间和对方计时不完全一样）；每天 150 条（给手动发测试、对方计数口径不同留 50 条余地）。
  # 每次运行合并成一条，正常一天几条到几十条，碰不到上限。到了上限的消息留在 outbox，下次运行（或第二天）再发
  max_per_minute: 4
  max_per_day: 150                    # “每天”按北京时间 0 点算
  max_retries: 3                      # 一条消息发失败后最多再试几次（加上第一次一共 4 次），还不行挪到 failed/
  max_title_chars: 100                # pushplus 标题上限 100 字
  max_content_chars: 18000            # pushplus 正文上限 2 万字，留余地；超过就拆成几条
  expire_hours: 24                    # 通用消息最长保留；预测还受消息内最早开球时间限制，重试也不发过期预测
  pushed_keep_days: 7                 # 推过的预测编号，开球几天后从状态文件里删掉（防止文件越来越大）
  kinds: [T-24, T-6, T-1]             # 推哪几种预测（接口 1 的 kind；preview 是双击预览页出的，不推）
  # 定时任务监控（数据状态页“定时任务”和故障推送共用）。任务名见接口 2
  jobs:
    refresh_data: {name: 数据采集与导入, stale_hours: 2}   # 每小时采集成功后立即导入；失败时保留失败心跳
    refresh_football_data: {name: 联赛赛果与收盘数据更新, stale_hours: 36}
    refresh_cups: {name: 杯赛与欧战赛程更新, stale_hours: 36}
    scheduled_predict: {name: 定时预测, stale_hours: 2}     # 每 15 分钟跑一次；超过 2 小时没成功算故障
    review: {name: 赛后对账、复盘, stale_hours: 18}        # 每天 09:10、21:10；留 6 小时余地
    site: {name: 网站重新生成, stale_hours: 2}             # 每 15 分钟重新生成一次
    notify: {name: 推送, stale_hours: 2}                    # 每 15 分钟跑一次
    ledger: {name: 四本账对账, stale_hours: 36}             # 每天 09:40 跑一次（src.jobs.ledger_daily）；只显示，不推送
  running_stale_minutes: 60           # “结束”为空（正在跑）超过几分钟，算“卡住或中途被关掉”
  # 推送程序自己（notify）出故障时推不出去，只在数据状态页显示；故障推送只看下面这几个任务
  push_jobs: [refresh_data, scheduled_predict, review, site]

# 第 8 阶段：欧洲杯赛的跨联赛实力对比（需求文档第 4 节“第 8 阶段怎么做”“第 8 阶段事先定的比较”）。数字都是跑回测之前定的，不选、不调
euro:
  competitions: [UCL, UEL, UECL]   # 只用这三项欧战（国内杯赛、超级杯不用）
  rating_leagues: [E0, SP1, D1, I1, F1]   # 有联赛内评分的联赛（= leagues.top）；其余球队一律算“联赛外”
  first_season: 2005               # 联赛内评分、欧战实力表从哪个赛季开始处理（前面的赛季只做热身，和 dyn 的回测一样）
  eval_first: 2014                 # 评分的欧战比赛从 2014/15 起，到 seasons.dev_last
  horizon_hours: 24                # 预测时点 T-24
  dev_end_month_day: "06-30"       # 取“开发赛季全部欧战”的截止时间 = seasons.dev_last 的下一年这一天（那时 2023/24 的欧战都踢完了，2024/25 的还没开始）
  refit_days: 7                    # 欧战实力表每隔几天重新估一次（和 backtest.refit_days 一样）
  delta_prior_sd: 0.5              # 联赛偏移 δ 的先验标准差（岭惩罚；事先定的，不选）
  neutral:                         # 库里没有中立场标记，按规则推断（需求文档“规则”第 2 条）
    final_round: F                 # 决赛（leg = 0）当中立场
    single_leg_season: 2019        # 2019/20 疫情后八月补赛的单场淘汰赛（leg = 0）当中立场
    single_leg_rounds: [R16, QF, SF]
    single_leg_competitions: [UCL, UEL]
  residual_days: 90                # 残差研究：看过去几天内的欧战；另外各看一遍 45、180 天
  residual_days_extra: [45, 180]
  dyn_model: dyn_q1e5_b01         # 欧战实力表用哪一组 dyn 的联赛评分（步骤 5 选出的）

# 新闻资料库（第 9 阶段，需求文档 7.1）。这次只从本地文件导入，不联网、不抓任何网站
news:
  inbox_dir: data/news_inbox      # 导入程序读这里的 news_*.jsonl（新闻条目）和 news_facts_*.jsonl（结构化信息）；data/ 不进 Git
  raw_subdir: news                # 导入的文件原样压缩，存到 paths.raw 下的这个文件夹
  report: 新闻导入.md             # 导入报告，放在 paths.reports 里
  fetched_future_tolerance_minutes: 10   # 抓到时间 / 录入时间比现在晚超过这么多分钟就拒绝（多半是时钟或时区写错）
  fact_types: [coach_change, long_injury]   # 结构化信息的种类：主帅更换、核心长期伤缺。要加新种类先改需求文档 7.1 和数据字典
  min_team_name_chars: 2          # 标题里认球队：中文名至少几个字
  min_team_name_chars_ascii: 4    # 标题里认球队：英文名至少几个字母（太短的缩写会认错）
  # 允许抓 / 导入的来源，由你决定后一行一个，例如：
  #   某某社: {status: 允许, note: robots.txt 和使用条款的核对结果}
  # 新闻及引用它的结构化信息只收“允许”的来源；规则产物必须引用已导入新闻。现在一个都没有登记
  # 唯一无新闻来源的例外是 method=人工 的手动结构化信息，仍检查球队、种类和录入时间
  sources: {}

# 第 10 阶段：角球、黄牌研究 src/evaluate/corners_cards_study.py（需求文档第 4 节“第 10 阶段：角球、黄牌怎么做”，跑之前写下，不临时加）
# 只做研究、只出报告，不改任何模型、融合 w、倾向门槛、信心等级，不碰期末考试赛季（赛季范围取 seasons.dev_last，不在这里重复写）
corners_cards:
  leagues: [E0, SP1, D1, I1, F1]   # 五大联赛；裁判只有英超有完整记录，所以裁判那一组只在 referee_league 里做
  referee_league: E0
  usage: 研究实验                  # 取数用途（数据字典，只在开发模式）
  horizon_hours: 24                # 预测时点：开球前 24 小时（T-24）
  refit_days: 7                    # 每隔几天重新拟合一次，和第 4 节其他模型一致
  min_train_matches: 760           # 每个联赛有角球 / 黄牌数的历史比赛不到这么多场（约两个赛季）就不出预测
  baseline_matches: 1000           # c0_league：同联赛截止前最近这么多场的场均数
  train_matches: 1520              # c1、c2、c3：用截止前最近这么多场拟合（约 4 个赛季）
  half_life_days: 365              # 时间衰减半衰期（固定，不选）
  ridge_grid: [5, 20, 80]          # 岭惩罚强度的 3 档，在 select_seasons 里选，角球、黄牌分别选
  select_seasons: [2005, 2013]     # 选惩罚强度用的赛季（含两头）
  eval_seasons: [2014, 2023]       # 评的赛季（含两头），不能超过 seasons.dev_last
  ref_ridge: 20                    # c3 里裁判项的岭惩罚强度（固定，不选）
  ref_min_matches: 20              # 裁判在截止前不到这么多场，裁判项取 0
  confidence_levels: [0.95, 0.99]  # 两个可信区间都要整个在“更准”一边才算更准（需求文档“判定规则”）
  calibration_bins: 10             # 校准：按预测均值分几档
  output_dir: data/reports/corners_cards   # 报告放这里（data/ 不进 Git）

# 网站“现读现出”（需求文档第 8 节“现读现出”，工作树 WD1）：登录后打开网页时，网站服务器（src/web/serve.py）现场用只读方式读数据库、
# 用和“生成网站”同一套函数做出网页；数据接口 /api/... 也用这里的数。读不出来时用上一次读到的，一次都没读到就发 data/site/ 的静态文件
live:
  # 改了这里（或改了代码）要重启“足球预测_网站服务”才生效
  dynamic: true                 # true = 现读现出；false = 和以前完全一样，只发 data/site/ 里定时生成好的静态文件（也没有 /api/、/static/）
  meta_refresh: false           # false = 现读现出的页面不带整页重新加载，靠 site.js 自己问服务器、数据变了才换内容（WD2 起）；
                                # true = 另外每 site.refresh_minutes 分钟整页重新加载一次。静态文件（dynamic: false）不受这项影响，照样整页重新加载
  poll_seconds: 30              # site.js 每几秒问一次 /api/version 和 /api/live（网页切到后台时不问；最少 5 秒）
  cache_seconds: 60             # 读出来的数据在内存里最多留几秒；数据库、data/review/、虚拟投注结果文件改了可以提前重读（见下一项）
  min_reload_seconds: 60        # 两次重读至少隔几秒：比赛期间数据库老在写抓取记录，不能每次都整个重读
  wait_seconds: 10              # 刚启动、一份数据都还没有时，请求最多等几秒；等不到就先发静态文件（接口回 503）
  stale_seconds: 600            # 即时比分文件超过几秒没更新，算“很久没更新”（/api/live 的 stale = true，页面上提醒）
  retry_seconds: 15             # 读数据失败后，隔几秒再试（中间先用上一次的数据，不每个请求都去碰数据库）
  # 即时比分文件的位置写在上面 dongqiudi.live.output（WD3 的程序写，这里只读）；没写时是 data/live/scores.json
  live_poller: false            # true = 网站服务器启动时在后台开即时比分程序（src.collect.dongqiudi_live，WD3 写）：
                                # 它会联网请求懂球帝，并往 football.db 的 fetch_log 表写抓取记录；false = 不开、不联网
  poller_stop_seconds: 5        # 网站服务器关掉时，最多等即时比分程序几秒（它正在联网时可能停不下来，不等它）

line_clv_study:               # 亚盘、大小球收盘线研究 src/evaluate/line_clv_study.py（需求文档第 14 节“亚盘、大小球收盘线研究怎么做”，跑之前写下）
  output_dir: data/backtest/line_clv_tc   # 结果放这里（data/ 不进 Git）；_tc = 新时间规则重跑（2026-11-07），旧规则的在 line_clv/
  model: gb_l7
  horizon: T-24
  first_season: 2019            # 平博亚盘、大小球的赛前和收盘 2019/20 起才有
  last_season: 2023             # 只用开发赛季；程序里再按 seasons.dev_last 检查
  groups:                       # 两组分开算，每组读哪次回测（data/backtest/ 下的文件夹，要有 predictions.csv 和 matrices_<模型>.npz）
    五大联赛: {run: tc_fix_gb_l7, leagues: [E0, SP1, D1, I1, F1]}
    次级联赛: {run: lc_second_2014-2023, leagues: [E1, SP2, D2, I2, F2]}
  second_check:                 # 次级联赛这次重跑的回测，先和 L2 的数核对（第 4 节 L2：2014–2023 次级联赛合计 gb_l7 对平博收盘的 log loss）
    run: lc_second_2014-2023
    log_loss: 1.0555
    tol: 0.0005
  hours_before_kickoff: 24      # 下注时点（和概率同一个时点）
  settle_after_kickoff_hours: 72
  usage_bet: 机器人下注
  usage_settle: 机器人结算
  odds_source: football-data
  book: 平博 Pinnacle           # 下虚拟注、算 CLV 都用这家
  consensus_book: 多家平均      # 回归里的 x₂（共识）用这家
  ou_line: 2.5
  devig_method: proportional
  clip: [0.01, 0.99]            # 亚盘线变了时，换算后的收盘胜算截到这个范围
  main_edge: 0.05               # 主判断用的“模型价值”门槛（期望收益 ≥ 5%）
  look_edges: [0.03, 0.08]      # 只看看的门槛
  min_b1: 0.05                  # b₁ 至少这么大才算“有实际用处”
  min_positive_seasons: 4       # 5 个赛季里至少几个 b₁ > 0
  suspicious_b1: 0.5            # b₁ 超过这个先当作偷看未来去查
  site_lean: 0.02               # 只看看：网站倾向规则（胜算 − 0.5 不小于这个，和 lean.ah、lean.over25 一样）
  random_seed: 20261104         # 随机对照的种子：每场用（种子, match_id）定

shrink_study:                 # 复盘问题回测：模型是不是把强弱差距、进球数估小了 src/evaluate/shrink_study.py（需求文档第 15 节，跑之前写下）
  per_match: data/backtest/line_clv_tc/per_match.csv   # 收盘线研究算好的每场表（gb_l7 T-24，平博赛前线）
  output_dir: data/backtest/shrink_study               # 结果放这里（data/ 不进 Git）
  main_group: 五大联赛          # 下结论只看这一组；别的组只列出来看看
  clip: [0.01, 0.99]            # 胜算先截到这个范围再取 logit，免得 0 和 1 算不出来
  live_dog_share:               # 起因那 47 场里挑弱队、挑小的场数（只拿来对照，不进检验）
    ah: [32, 41]
    ou: [39, 47]

pick_tiers_study:             # 四个玩法的“把握”等级 src/evaluate/pick_tiers_study.py（需求文档第 5 节“四个玩法的‘把握’等级怎么定”，跑之前写下）
  output_dir: data/backtest/pick_tiers_tc   # 结果放这里（data/ 不进 Git）；_tc = 新时间规则重跑（2026-11-07），旧规则的在 pick_tiers/
  run: tc_fix_gb_l7              # 读哪次回测（data/backtest/ 下，要有 predictions.csv、matrices_gb_l7.npz、fusion_odds.csv）；2026-11-07 起新时间规则
  first_season: 2012             # 平博赛前赔率 2012/13 起才有
  cut_last: 2019                 # 2012–2019 定切点（三等分）
  test_last: 2023                # 2020–2023 检验；程序里再按 seasons.dev_last 检查，考试赛季不读
  leagues: [E0, SP1, D1, I1, F1]
  ou_lines: [0.5, 6.0, 0.25]     # 推“大小球主盘口”时试的线：从 0.5 到 6，每隔 0.25
  check_first_season: 2018       # 推出来的主盘口和懂球帝真主盘口核对，从这季起（懂球帝 2018/19 起有大小球）
  usage: 研究实验                 # 核对时取懂球帝变盘记录的用途（只在开发模式）
  calib_tol: 0.03                # 校准：平均把握分和实际命中率差不超过 3 个百分点
  boot: 2000                     # 按周成块 bootstrap 次数
  random_seed: 20261104
direction_study:              # 选方向研究 src/evaluate/direction_study.py（需求文档第 4 节“选方向研究怎么做”“事先定的比较”，跑之前写下）
  output_dir: data/backtest/direction_study    # 结果放这里（data/ 不进 Git）；--root 给项目文件夹，相对路径从那里算
  run: data/backtest/w9_gb_l7                   # gb_l7 的回测（predictions.csv、fusion_odds.csv、run_info.json）
  inj_run: data/backtest/direction_study/inputs/s7_eval   # 伤停研究 I7 的回测 s7_eval，原样复制过来（predictions.csv、run_info.json）
  base_model: gb_l7              # 上线的 A 版
  inj_models: [gb_l7_r, gb_inj]  # I7 那次回测里：和 gb_l7 一样（只是用途不同）、加伤停三项
  inj_usage: 研究实验             # 伤停那份的用途（只在开发模式）
  horizon: T-24
  leagues: [E0, SP1, D1, I1, F1]
  first_season: 2014             # 伤停那份从 2014/15 开始，所有候选用同一批比赛
  param_last: 2019               # 2014–2019 定参数
  test_last: 2023                # 2020–2023 检验；程序里再按 seasons.dev_last 检查，考试赛季不读
  refit_tol: 0.001               # 反推的比分矩阵算回来的四个概率和存的概率最多差这么多，超过就停下
  grids:                         # 候选的参数：[从, 到, 每档]
    a_k: [0.5, 1.5, 0.05]        # A：差 s 乘 k（让球、胜平负）
    a_b: [-0.20, 0.20, 0.02]     # A：差 s 加 b（让球、胜平负）
    a_d: [-0.20, 0.20, 0.01]     # A：总 m 加 d（大小球）
    b_a: [0.0, 1.0, 0.05]        # B：模型往赔率拉，a = 0 就是赔率
    c_tau: [0.0, 0.10, 0.005]    # C：赔率离五五开不到 τ 就听模型，τ = 0 就是赔率
    e_c: [0.0, 3.0, 0.25]        # E：赔率 + c × 伤停带来的变化，c = 0 就是赔率
  min_gain: 0.005                # 判断第 3 条：差至少 +0.5 个百分点
  min_positive_seasons: 3        # 判断第 2 条：四个检验赛季里至少几个差 > 0
  bonferroni_z: 2.576            # 5 个候选：95% 换成 99%，bootstrap 标准差 × 2.576
  calib_bins:                    # 校准分档（写的胜算的边，最后一个往上是一档）
    two_way: [0.50, 0.525, 0.55, 0.60]       # 让球、大小球
    three_way: [0.0, 0.45, 0.55, 0.65]       # 胜平负
  diverge_bins: [0.0, 0.02, 0.05, 0.10]      # 只是看看：gb_l7 和赔率的主队让球胜算差（绝对值）
  inj_bins: [0.0, 0.01, 0.03]                # 只是看看：gb_inj 和 gb_l7_r 的主队让球胜算差（绝对值）
# 网站上的操作按钮（src/web/actions.py，需求文档第 8 节“网站上的操作按钮”、第 16 节“安全”）
# 只在 live.dynamic: true 时有；改了这里要重启“足球预测_网站服务”才生效
actions:
  enabled: true                 # 总开关：false = 数据状态页上没有按钮，/api/action/<名字> 和 /api/actions 都回 404
  log_file: logs/site_actions.log   # 每次按钮运行的输出（脱敏后）写在这里，网页上不显示（logs/ 不进 Git）
  log_max_bytes: 1000000        # 日志满 1 MB 换一个新文件
  log_backups: 3                # 旧日志留几个
  log_tail_chars: 4000          # 每次运行最多记输出的最后多少个字（刷新数据的输出很长，只留结尾）
  poll_seconds: 3               # 按了按钮以后，网页上的脚本每几秒问一次 /api/actions，直到跑完
  busy_minutes: 15              # 生成网站、推送的心跳文件“结束”是空的、开始不到这么多分钟，算那个定时任务正在跑
  timeout_minutes:              # 每个按钮最多跑多久（分钟），到点结束子程序；和定时任务的上限一样
    refresh_data: 50
    predict: 30
    build_site: 10
    test_push: 2

# 调研别人的足球预测项目（需求文档第 5 节“别人的项目”、6.1“调研别人的项目用的网站”；src/collect/others_review.py）
# 规则跑之前定死：检索词、每个取几条、请求间隔都在这里，不临时改。
others_review:
  raw_subdir: others_review     # 存在 paths.raw 下面这个文件夹（不进 Git）
  user_agent: "FootballLearningProject/0.1 (personal study; https://github.com/DogRanchKiller/-1.0) python-requests"
  openalex_url: https://api.openalex.org/works
  openalex_queries:
    - football match outcome prediction
    - soccer match prediction machine learning
    - football betting market efficiency prediction
    - soccer prediction ranked probability score
  openalex_per_query: 15        # 每个检索词按被引次数取前几篇
  github_search_url: https://api.github.com/search/repositories
  github_repo_url: https://api.github.com/repos
  github_queries: [football prediction, soccer prediction]
  github_per_query: 30          # 每个检索词按星数取前几个
  arxiv_url: https://arxiv.org
  max_per_kind: 12              # 论文、项目各最多几个进评分表
  min_interval_seconds: {openalex: 40, github: 2, arxiv: 15}   # arXiv 的 robots.txt 要求 15 秒；OpenAlex 2 秒一次会被拒（429），40 秒一次没问题（2026-11-05）
  retry_waits: [60, 180, 600]   # 失败后等几秒再试
  demo:                         # 第四部分：拿我们自己的数据演示（src/evaluate/others_demo.py，只报告）
    top_shares: [0.10, 0.05]    # 胜平负只挑把握分最高的几成
    ou_fixed: [1.5, 2.5, 3.5]   # 大小球固定这几条线
    output: data/backtest/others_demo.json

# 复现 Yeung 等 2024 的深度学习（需求文档第 5 节“复现 Yeung 等…怎么做”；src/models/yeung_nn.py、src/evaluate/yeung_repro.py）
# 参数全照原文代码（calvinyeungck/Soccer-Prediction-Challenge-2023），跑之前定死，不调。
repro_yeung:
  window: 5                     # 每队看最近几场
  team_embedding_dim: 1         # 球队编号 → 几个可学的数
  inception_kernels: 6          # Inception 块里几种卷积核（1×1、3×3 … 11×11）
  inception_channels: 4         # Inception 块中间几个通道（代码里的 d_ff）
  te_heads: 1                   # Transformer 编码层几个头
  te_feedforward: 1             # Transformer 编码层前馈几维
  te_dropout: 0
  mlp_layers: 1                 # 论文写 10，代码和权重文件都是 1 → 用 1
  mlp_dropout: 0.2
  learning_rate: 0.01
  adam_eps: 1.0e-16
  batch_size: 100
  epochs: 42
  train_years: 5                # 训练用截止时间前几年
  retrain_days: 91              # 每隔几天重新训练（和 gbdt.retrain_days 一样）
  seeds: [0, 1, 2]              # 第一个是主结果，后两个只看“换种子差多少”
  first_season: 2005            # 比赛历史从这季起
  eval_first: 2014              # 评分从这季起，到 seasons.dev_last
  horizon_hours: 24
  compare_with: w9_gb_l7        # 和哪次回测的 gb_l7 比（data/backtest/<这个>/predictions.csv）
  compare_model: gb_l7
  run_name: yeung_repro         # 结果放 data/backtest/<这个>/

timing_check:                 # 开发顺序第 1 步“时间核对”（需求文档第 12 节）：T-24 用到的每一项信息什么时候公开、系统什么时候拿到。只查不改
  title: 时间核对：T-24 用到的信息什么时候公开、系统什么时候拿到
  # 运行（工作树 TC）：python -m src.evaluate.timing_check。只读打开数据库，不写任何表
  output: data/reports/时间核对.md
  leagues: top                # 查哪一组联赛（leagues 段里的名字）
  seasons: [2005, 2023]       # 查 football-data 赛前赔率的赛季（只看开发赛季；只读赛程和“有没有赛前赔率”，不读比分）
  odds_source: football-data
  # football-data 说明文件（data/raw/football-data/notes/2026-10-30.txt 第 198 行）：
  # “周末比赛的赔率周五下午采集，周中比赛周二下午采集”。周几用数字：周一 0 … 周日 6。
  # 每场比赛的采集日 = 比赛日（英国日期）当天或之前、最近的一个采集日：周五、六、日、一 → 周五；周二、三、四 → 周二。
  # 说明文件没说几点、也没说以前的赛季是不是一样，所以“下午”用两头算：12:00 和 18:00（英国时间）。
  collection_weekdays: [1, 4]
  collection_hours_london: [12, 18]
  horizon_hours: 24           # 回测的预测时点（T-24）

ledger:                       # 开发顺序第 2 步“四本账”（需求文档第 16 节“四本账怎么算（第 2 步）”，跑之前写下）
  # 运行（工作树 LDG）：python -m src.evaluate.ledger。只读打开数据库，不写任何表
  output_dir: data/backtest/ledger   # ledger_matches.csv、ledger_summary.csv（data/ 不进 Git）
  leagues: top                # 五大联赛（leagues 段里的组名）
  model: gb_xg                # 现在出预测的模型（和 preview.model 一样；2026-11-07 以前的存档是 gb_l7，要看那一段就临时改回 gb_l7 再跑）
  kinds: [T-24, T-6, T-1]     # 对哪几个时点的存档
  main_kind: T-24             # 只有这个时点下结论，另外两个只报告
  min_matches: 1000           # 一个通道少于这么多场：只列数，不算区间、不下结论
  pinnacle: 平博 Pinnacle     # 亚盘、大小球的市场价用哪家（config/bookmakers_dongqiudi.yaml 换过的写法）

lottery_value:                 # 竞彩价格偏离虚拟实盘 src/evaluate/lottery_value.py（需求文档第 14 节“竞彩价格偏离虚拟实盘”，跑之前写下）
  # 运行：python -m src.evaluate.lottery_value；每天 09:40 跟四本账一起跑（src/jobs/ledger_daily.py）。只读打开数据库
  output_dir: data/backtest/lottery_value   # candidates / bets / skipped / summary / decisions_log（data/ 不进 Git）
  # 联赛（leagues 段里的组名，可以写几个）。2026-11-07 加 second、jc：规则一点没改，只是多了比赛。
  # 次级联赛懂球帝只抓得到英冠、西乙、德乙（dongqiudi.league_ids），快照 11-07 起才有；
  # 意乙、法乙和更早的场都会记成“决定时间之前没有竞彩价格”。jc 五个联赛 11-07 起才有比赛
  leagues: [top, second, jc]
  first_kickoff_utc: "2026-10-30 00:00:00"  # 从这天起开球的比赛（懂球帝每小时快照 2026-10-30 起才有竞彩赛前价格）
  count_from_utc: "2026-11-07 00:00:00"     # 决定时间在这之后的注才“正式计数”（规则写下以后）；之前的只看看
  hours_before: 6              # 决定时间 = 开球前几小时
  sale_window_bj: ["09:00", "21:30"]        # 竞彩能买的时间段（北京时间，停售时间待核实，宁早勿晚）
  pinnacle: 平博 Pinnacle      # 公道价只用这家
  products: {result: 竞彩胜平负, handicap: 竞彩让球}
  max_fit_error: 0.01          # 让球用的反推比分矩阵，还原误差超过这个就不算让球那三注
  ev_threshold: 0.05           # 主规则：每场 EV 最大的那个选项 ≥ 这个才下 1 注
  report_thresholds: [0.0, 0.02, 0.05, 0.10]   # 报告里列哪些门槛（只有 ev_threshold 那个下结论）
  min_bets_report: 100         # 有 CLV 的注少于这么多：只列数
  pass_bets: 300               # 至少这么多注才可能“通过”
  give_up_bets: 600            # 这么多注还没通过就停下

baseline:                     # 开发顺序第 3 步“历史基线”src/evaluate/baseline.py（需求文档第 16 节“历史基线怎么算（第 3 步）”，跑之前写下）
  # 运行（工作树 BAS）：python -m src.evaluate.baseline。只读打开数据库；结果放 data/backtest/<run>/baseline_*
  run: tc_fix_gb_l7           # 冻结版本的回测（v1.12 新时间规则；要有 predictions.csv 和 matrices_gb_l7.npz）
  model: gb_l7
  horizon: T-24
  leagues: top                # 五大联赛（leagues 段里的组名）
  usage: 评估                 # 取赛前价的用途（数据字典）
  late_hours: 72              # “截止时间 + 这么多小时”再取一次，只用来数“有赛前价、T-24 还没采到”的场
  line_books: [平博 Pinnacle, 多家平均]   # 亚盘让球、大小球 2.5 各比哪几家
  main_book: 平博 Pinnacle    # 亚盘让球、大小球下结论用这家（2019/20 起才有）；其余只报告
  result_label: 平博优先      # 胜平负、比分的市场写成什么（按 market_odds.result_books：平博，没有用多家平均）
  period_split: 2014          # 两段分开报告：这个赛季之前 / 这个赛季起（和 fusion_study 一样）
