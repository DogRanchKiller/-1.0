# 德比清单（复盘自动标签用，需求文档第 15 节“标签和备注”）。
#
# 收录原则（保守）：只收公认的、有固定名字的德比，大多数在维基百科有单独的词条
#   （例如 en.wikipedia.org/wiki/North_London_derby）。拿不准的不收。
#   清单只用来给复盘的比赛贴标签，不当模型输入（要当模型输入，先在 data_usage.yaml 登记，见报告）。
#
# 写法：
#   名字    中文名
#   英文名  英文名（维基百科词条名，方便查来源）
#   类型    同城 = 同一座城市；地区 = 同一地区 / 邻近城市；宿敌 = 不同地区，但长期争冠或历史恩怨
#   球队    teams.yaml 里的“英文”（球队编号）。可以写 2 队以上，任意两队之间的比赛都算这个德比
#           （例如英格兰东北德比 Newcastle / Sunderland 只有两队；南威尔士德比 Cardiff / Swansea）
#   同一对球队只能出现在一个德比里，重复了读文件时报错。
#
# 联赛无关：两队只要在我们的联赛（顶级或次级）里碰面就算，例如英冠里的 Sheffield United – Sheffield Weds。
