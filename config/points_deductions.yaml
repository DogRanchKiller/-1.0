#   原因 / 来源
#
# 来源：英文维基百科各赛季页面积分榜下面的注释（Notes），2026-10-30 下载、核对。
# 日期是凭新闻记忆写的、没有找到原文的，都写“赛季结束”，不猜。
# 还没录的扣分（主要是次级联赛）见 data/reports/积分榜核对_差异.csv 里“积分不一样”的行。
