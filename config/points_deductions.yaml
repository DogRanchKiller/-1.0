# 扣分记录（算赛前积分榜用，src/features/standings.py 读）。
#
# 每条写：
#   联赛 / 赛季 / 球队   赛季用开始年份；球队用 teams.yaml 的“英文”
#   分数                 扣分写负数；上诉后退回的分写正数（另起一条，写退回那天）
#   生效                 从哪天起算进积分榜：
#                          写日期（例如 2023-11-17）= 宣布那天，程序按第二天 00:00 UTC 起算（宁晚勿早）
#                          写“赛季结束”= 宣布日期查不到，只算进最终积分榜，赛季中间的积分榜不扣
