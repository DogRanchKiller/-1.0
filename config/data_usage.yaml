# 数据用途字典：每类数据“什么时候能知道”、“允许用在哪里”（需求文档第 16 节“不偷看未来”、第 17 节“数据用途”“怎么保证不用错”）。
#
# 人看这个文件就知道每种数据能用在哪里；取数层 src/features 读同一个文件，用途不允许就直接报错。
# 以后加新数据：先在这里登记，再接进代码（第 17 节“新数据先登记”）。
#
# 两个“范围”：
#   以前的比赛：截止时间之前已经踢完、结果已经能知道的比赛。例如预测 3 月 1 日的比赛时，2 月 25 日那场的比分。
#   本场：要预测的这一场（或者赛后要打分的这一场）。本场的比分是“答案”，赛前任何版本都不能用。
# 同一种数据，以前比赛的可以当模型输入，本场的只能赛后当答案——这是最关键的区分。
#
# 每类数据的字段：
#   含义 / 来源 / 有数据的年份：给人看
#   表、列：取数层从数据库哪里拿（表还没有的写“还没有”，到对应阶段再接）
#   什么时候能知道：规则名，具体算法见下面“可知时间规则”，数字在 settings.yaml 的 features 段
#   以前的比赛、本场：两个范围各自允许的用途（用途名必须是下面“用途”里有的）
#   模型输入从第几阶段起：标了这个的，凡是“模型输入: 是”的用途，要到这个阶段才放开（阶段号见 settings.yaml 的 features.current_stage）
#   注意：报错时会把这段话显示出来，解释为什么不行

# ---------- 调用方要声明的用途 ----------
# 赛前: 是 —— 这个用途是“开球前做决定”，所以对本场的数据，截止时间必须早于开球
# 模型输入: 是 —— “模型输入从第几阶段起”只管这些用途
用途:
  A版输入: {赛前: 是, 模型输入: 是, 说明: 不用赔率的模型的输入（第 2 阶段的频率、Elo、泊松、DC 也属于这一类；第 4 阶段的梯度提升树 A 版）}
  B版输入: {赛前: 是, 模型输入: 是, 说明: 把赔率当输入特征的模型（第 4 节步骤 8）}
  人工调整版: {赛前: 是, 模型输入: 是, 说明: A 版加上你手动标记的缺阵之后的版本}
  融合: {赛前: 是, 模型输入: 否, 说明: 融合概率里“赔率概率”那一份；对以前的比赛是回测里滚动选融合权重 w（只能用当时之前的比赛）}
  休息天数和欧战后标签: {赛前: 是, 模型输入: 否, 说明: 算两场比赛之间隔了几天、这场是不是刚踢完欧战}
  机器人下注: {赛前: 是, 模型输入: 否, 说明: 虚拟投注机器人赛前决定下不下、按什么价格下}
  评估: {赛前: 否, 模型输入: 否, 说明: 赛后打分、两个标杆、三个检验、CLV、调整前后对比}
  机器人结算: {赛前: 否, 模型输入: 否, 说明: 赛后给虚拟注单结算、算收盘线价值}
  复盘: {赛前: 否, 模型输入: 否, 说明: 赛后复盘、误差归类、分组统计}
  显示: {赛前: 否, 模型输入: 否, 说明: 网页详情页、球队页显示}

# ---------- 可知时间规则（代码里实现，见 src/features/known_time.py） ----------
# “只有日期、没有开球时间”的比赛（football-data 2019/20 以前全是这样），按保守规则：
#   判断“是不是还在开球前”时，当作这一天最早的 00:00 开球（英国时间）——宁可认为它开球早；
#   判断“什么时候知道结果”时，当作这一天最晚的 24:00 开球（英国时间）——宁可认为它结果出来得晚。
可知时间规则:
  赛程: 赛前一直能知道（联赛的赛程赛季开始前就公布了）
  开球: 开球那一刻能知道“这场比赛踢了”（只有日期时：当天 24:00 英国时间）
  赛后: 开球时间 + features.result_available_after_kickoff_hours 小时（只有日期时：当天 24:00 英国时间再加这几个小时）
  赛前赔率: 开球前 features.pre_odds_hours_before_kickoff 小时（按来源分；只有日期时从当天 00:00 英国时间往前算）。没登记的来源一律拿不到
  收盘: 开球那一刻（只有日期时：当天 24:00 英国时间）。所以本场的收盘赔率，开球前任何时候都拿不到
  抓取时间: 我们第一次抓到的时间（第 1b 阶段的伤停、首发、竞彩用这个）
  变盘时间: 网站显示的变盘时间（第 1b 阶段的变盘记录用这个）

# ---------- 每类数据 ----------
数据:
  比赛信息:
    含义: 联赛、赛季、主客队、日期、开球时间
    来源: football-data（以后加国内网站）
    有数据的年份: 1993/94 起；开球时间 2019/20 起
    表: matches
    什么时候能知道: 赛程
    以前的比赛: [A版输入, B版输入, 人工调整版, 融合, 休息天数和欧战后标签, 机器人下注, 评估, 机器人结算, 复盘, 显示]
    本场: [A版输入, B版输入, 人工调整版, 融合, 休息天数和欧战后标签, 机器人下注, 评估, 机器人结算, 复盘, 显示]
    注意: 比赛状态（已赛 / 改期 / 取消）是后来才知道的，取“预测目标”时不能拿它挑比赛

  比分:
    含义: 全场比分（90 分钟含补时）和赛果
    来源: football-data
    有数据的年份: 1993/94 起
    表: match_stats
    列: [home_goals, away_goals, result]
    什么时候能知道: 赛后
    以前的比赛: [A版输入, B版输入, 人工调整版, 融合, 评估, 复盘]
    本场: [评估, 机器人结算, 复盘]
    注意: 本场比分是答案，只能赛后用来打分、结算、复盘；以前比赛的比分是用来估实力的输入

  射门、xG:
    含义: 射门、射正、xG
    来源: football-data（xG 只有 2026/27 起；历史 xG 来源待定，见待定问题 6）
    有数据的年份: 射门英超 2000/01、其他顶级联赛 2005/06、次级联赛 2017/18 起
    表: match_stats
    列: [home_shots, away_shots, home_shots_on_target, away_shots_on_target, home_xg, away_xg]
    什么时候能知道: 赛后
    以前的比赛: [A版输入, B版输入, 人工调整版, 评估, 复盘]
    本场: [复盘]
    注意: 本场的射门、xG 赛后才有，只能用来复盘（判断是不是运气型）

  角球、黄牌:
    含义: 角球、犯规、黄牌、红牌
    来源: football-data
    有数据的年份: 和射门差不多
    表: match_stats
    列: [home_corners, away_corners, home_fouls, away_fouls, home_yellow, away_yellow, home_red, away_red]
    什么时候能知道: 赛后
    以前的比赛: [A版输入, B版输入, 人工调整版, 复盘]
    本场: [复盘]
    模型输入从第几阶段起: 10
    注意: 角球、黄牌第 10 阶段才进模型，现在只存

  半场比分:
    含义: 半场比分
    来源: football-data
    有数据的年份: 1995/96 前后起
    表: match_stats
    列: [ht_home_goals, ht_away_goals]
    什么时候能知道: 赛后
    以前的比赛: [复盘]
    本场: [复盘]
    注意: 不做半场玩法，导入但暂不用；以后要试作特征，先在这里加用途

  裁判:
    含义: 裁判名字（只有英超、英冠）
    来源: football-data
    有数据的年份: 英超、英冠 2000/01 起
    表: match_stats
    列: [referee]
    什么时候能知道: 赛后
    以前的比赛: [显示]
    本场: [显示]
    注意: 先存，暂不用。裁判其实赛前几天公布，但 football-data 是赛后才给的，按赛后算

  赛前赔率:
    含义: 各公司赛前的胜平负、大小球 2.5、亚盘
    来源: football-data（周五下午 / 周二下午采集，离开赛约 1–3 天）
    有数据的年份: 多家平均 2005/06 起；平博 2012/13 起；Bet365 2002/03 起
    表: odds
    条件: timing = 'pre'
    什么时候能知道: 赛前赔率
    以前的比赛: [B版输入, 融合, 评估, 复盘]
    本场: [B版输入, 融合, 机器人下注, 评估, 显示]
    注意: A 版不用赔率作输入（第 4 节），否则就不是“只看比赛数据”的模型，和赔率比较、融合都没有意义

  收盘赔率:
    含义: 各公司开球时的最后一个价格
    来源: football-data
    有数据的年份: 平博 2012/13 起；多家平均 2019/20 起
    表: odds
    条件: timing = 'close'
    什么时候能知道: 收盘
    以前的比赛: [B版输入, 评估, 复盘]
    本场: [评估, 机器人结算, 复盘, 显示]
    注意: 本场的收盘赔率开球时才有，任何版本赛前都拿不到；以前比赛的收盘赔率只给 B 版，A 版不能用

  变盘记录:
    含义: 带时间的盘口、赔率变化
    来源: 国内网站（第 1b 阶段起）
    有数据的年份: 还没有
    表: 还没有
    什么时候能知道: 变盘时间
    以前的比赛: [B版输入, 机器人下注, 复盘]
    本场: [B版输入, 机器人下注, 显示]
    注意: A 版和用 A 版概率的机器人不能用；只能用到预测时点 / 下注时点为止的记录

  竞彩赔率:
    含义: 中国体育彩票竞彩的赔率
    来源: 国内网站（第 1b 阶段起）
    有数据的年份: 还没有
    表: 还没有
    什么时候能知道: 抓取时间
    以前的比赛: []
    本场: [显示]
    注意: 先存档，只显示

  首发:
    含义: 首发名单
    来源: 英文来源（第 1b 阶段定）
    有数据的年份: 还没有
    表: 还没有
    什么时候能知道: 抓取时间
    以前的比赛: [复盘]
    本场: [A版输入, B版输入, 人工调整版, 复盘, 显示]
    模型输入从第几阶段起: 4
    注意: 只给 T-1 版，第 4 节步骤 7（第 4 阶段）起才进模型

  英文伤停:
    含义: 伤停名单
    来源: 英文来源（第 1b 阶段定）
    有数据的年份: 还没有
    表: 还没有
    什么时候能知道: 抓取时间
    以前的比赛: [复盘]
    本场: [A版输入, B版输入, 人工调整版, 复盘, 显示]
    模型输入从第几阶段起: 4
    注意: 按抓取时间算能不能用（网站不显示伤停什么时候出现的）

  中文伤停:
    含义: 国内网站的伤停名单
    来源: 国内网站
    有数据的年份: 还没有
    表: 还没有
    什么时候能知道: 抓取时间
    以前的比赛: []
    本场: [显示]
    注意: 只作详情页的备用显示

  手动缺阵:
    含义: 你在手动标记页标的缺阵
    来源: 你手动输入
    有数据的年份: 还没有
    表: 还没有
    什么时候能知道: 抓取时间
    以前的比赛: [评估, 复盘]
    本场: [人工调整版, 评估, 复盘, 显示]
    注意: 只进“已人工调整”版，调整前后两版都存

  你的备注、手动标签:
    含义: 你写的备注和标签
    来源: 你手动输入
    有数据的年份: 还没有
    表: 还没有
    什么时候能知道: 抓取时间
    以前的比赛: [复盘]
    本场: [复盘, 显示]
    注意: 模型不能读（第 17 节“数据分层”）

  新闻:
    含义: 新闻列表和结构化信息（主帅更换等）
    来源: 第 9 阶段定
    有数据的年份: 还没有
    表: 还没有
    什么时候能知道: 抓取时间
    以前的比赛: [A版输入, B版输入]
    本场: [A版输入, B版输入, 显示]
    模型输入从第几阶段起: 9
    注意: 第 9 阶段只用结构化部分

  杯赛欧战赛程:
    含义: 杯赛、欧战的日期、对手、轮次（不含比分）
    来源: 待定（待定问题 5）
    有数据的年份: 还没有
    表: matches（competition 不是 settings.yaml 里的联赛）
    什么时候能知道: 开球
    以前的比赛: [休息天数和欧战后标签, 显示]
    本场: [显示]
    注意: 杯赛欧战赛程只能用来算休息天数和“欧战后”标签，不能直接当模型输入；要当输入，先用它算出休息天数再说

  杯赛欧战比分:
    含义: 杯赛、欧战的比分
    来源: 待定（待定问题 5）
    有数据的年份: 还没有
    表: match_stats（competition 不是 settings.yaml 里的联赛）
    列: [home_goals, away_goals, result]
    什么时候能知道: 赛后
    以前的比赛: [A版输入, B版输入, 人工调整版, 评估, 复盘]
    本场: [评估, 复盘]
    模型输入从第几阶段起: 8
    注意: 欧战比分第 8 阶段（扩展欧洲杯赛）才进模型；现在只用杯赛的赛程

# ---------- 运行模式：每种模式能读哪些赛季（第 17 节“三种运行模式”） ----------
# 赛季用途由 src.common.config.season_role 判断：开发 dev / 期末考试 exam / 上线后 live。
# 每种模式下，每类赛季允许哪些用途；不在列表里的就报错（不是悄悄跳过，免得以为自己用的是全部数据）。
# “全部”= 上面“用途”里的每一个。
运行模式:
  开发:
    说明: 回测、比较模型、调参。期末考试赛季锁住，连“当预测目标”都不行
    dev: 全部
    exam: []
    live: []
  考试:
    说明: 第 4 阶段末考一次。考试赛季可以读、可以打分
    dev: 全部
    exam: 全部
    live: []
  实时:
    说明: 给未来比赛出预测。考试赛季只用来估当前实力，不在上面打分、调参（第 5 节“锁住只针对评分和调参”）
    dev: 全部
    exam: [A版输入, B版输入, 人工调整版, 休息天数和欧战后标签, 显示]
    live: 全部
