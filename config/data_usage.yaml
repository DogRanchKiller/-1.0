# 数据用途字典：每类数据“什么时候能知道”、“允许用在哪里”（需求文档第 16 节“不偷看未来”、第 17 节“数据用途”“怎么保证不用错”）。
#
# 人看这个文件就知道每种数据能用在哪里；取数层 src/features 读同一个文件，用途不允许就直接报错。
# 以后加新数据：先在这里登记，再接进代码（第 17 节“新数据先登记”）。
#
# 两个“范围”：
#   以前的比赛：截止时间之前已经踢完、结果已经能知道的比赛。例如预测 3 月 1 日的比赛时，2 月 25 日那场的比分。
#   本场：要预测的这一场（或者赛后要打分的这一场）。本场的比分是“答案”，赛前任何版本都不能用。
# 同一种数据，以前比赛的可以当模型输入，本场的只能赛后当答案——这是最关键的区分。
#
# 每类数据的字段：
#   含义 / 来源 / 有数据的年份：给人看
#   表、列：取数层从数据库哪里拿（表还没有的写“还没有”，到对应阶段再接）
#   什么时候能知道：规则名，具体算法见下面“可知时间规则”，数字在 settings.yaml 的 features 段
#   以前的比赛、本场：两个范围各自允许的用途（用途名必须是下面“用途”里有的）
#   模型输入从第几阶段起：标了这个的，凡是“模型输入: 是”的用途，要到这个阶段才放开（阶段号见 settings.yaml 的 features.current_stage）
#   注意：报错时会把这段话显示出来，解释为什么不行

# ---------- 调用方要声明的用途 ----------
# 赛前: 是 —— 这个用途是“开球前做决定”，所以对本场的数据，截止时间必须早于开球
# 模型输入: 是 —— “模型输入从第几阶段起”只管这些用途
# 只在开发模式: 是 —— 这个用途只能在开发模式下用（考试、实时模式一律报错，哪怕运行模式那里写了“全部”）
用途:
  A版输入: {赛前: 是, 模型输入: 是, 说明: 不用赔率的模型的输入（第 2 阶段的频率、Elo、泊松、DC 也属于这一类；第 4 阶段的梯度提升树 A 版）}
  B版输入: {赛前: 是, 模型输入: 是, 说明: 把赔率当输入特征的模型（第 4 节步骤 8）}
  人工调整版: {赛前: 是, 模型输入: 是, 说明: A 版加上你手动标记的缺阵之后的版本}
  融合: {赛前: 是, 模型输入: 否, 说明: 融合概率里“赔率概率”那一份；对以前的比赛是回测里滚动选融合权重 w（只能用当时之前的比赛）}
  休息天数和欧战后标签: {赛前: 是, 模型输入: 否, 说明: 算两场比赛之间隔了几天、这场是不是刚踢完欧战}
  机器人下注: {赛前: 是, 模型输入: 否, 说明: 虚拟投注机器人赛前决定下不下、按什么价格下}
  评估: {赛前: 否, 模型输入: 否, 说明: 赛后打分、两个标杆、三个检验、CLV、调整前后对比}
  机器人结算: {赛前: 否, 模型输入: 否, 说明: 赛后给虚拟注单结算、算收盘线价值}
  复盘: {赛前: 否, 模型输入: 否, 说明: 赛后复盘、误差归类、分组统计}
  显示: {赛前: 否, 模型输入: 否, 说明: 网页详情页、球队页显示}
  研究实验: {赛前: 是, 模型输入: 是, 只在开发模式: 是, 说明: 只为回答一个研究问题的回测（例如第 4 节步骤 4 “xG 比射门好多少”），结果不上线、不进期末考试；数据可以是不能上线的（例如 Understat 镜像）}

# ---------- 可知时间规则（代码里实现，见 src/features/known_time.py） ----------
# “只有日期、没有开球时间”的比赛（football-data 2019/20 以前全是这样），按保守规则：
#   判断“是不是还在开球前”时，当作这一天最早的 00:00 开球（英国时间）——宁可认为它开球早；
#   判断“什么时候知道结果”时，当作这一天最晚的 24:00 开球（英国时间）——宁可认为它结果出来得晚。
可知时间规则:
  赛程: 赛前一直能知道（联赛的赛程赛季开始前就公布了）
  开球: 开球那一刻能知道“这场比赛踢了”（只有日期时：当天 24:00 英国时间）
  赛后: 开球时间 + features.result_available_after_kickoff_hours 小时（只有日期时：当天 24:00 英国时间再加这几个小时）
  赛前赔率: 开球前 features.pre_odds_hours_before_kickoff 小时（按来源分；只有日期时从当天 00:00 英国时间往前算）。没登记的来源一律拿不到
  收盘: 开球那一刻（只有日期时：当天 24:00 英国时间）。所以本场的收盘赔率，开球前任何时候都拿不到
  抓取时间: 我们第一次抓到的时间（第 1b 阶段的伤停、首发、竞彩用这个）
  变盘时间: 网站显示的变盘时间（第 1b 阶段的变盘记录用这个）
  快照时间: 文件里每行自己写的时间点（as_of_utc 列，例如伤停研究的“开球前 24 小时”）。截止时间早于它，这一行的数就是空值

# ---------- 每类数据 ----------
数据:
  比赛信息:
    含义: 联赛、赛季、主客队、日期、开球时间
    来源: football-data（以后加国内网站）
    有数据的年份: 1993/94 起；开球时间 2019/20 起
    表: matches
    什么时候能知道: 赛程
    以前的比赛: [A版输入, B版输入, 人工调整版, 融合, 休息天数和欧战后标签, 机器人下注, 评估, 机器人结算, 复盘, 显示, 研究实验]
    本场: [A版输入, B版输入, 人工调整版, 融合, 休息天数和欧战后标签, 机器人下注, 评估, 机器人结算, 复盘, 显示, 研究实验]
    注意: 比赛状态（已赛 / 改期 / 取消）是后来才知道的，取“预测目标”时不能拿它挑比赛

  比分:
    含义: 全场比分（90 分钟含补时）和赛果
    来源: football-data；football-data 还没更新的当前赛季比赛先用懂球帝赛程里的比分（2026-10-31 起）
    有数据的年份: 1993/94 起
    表: match_stats
    列: [home_goals, away_goals, result]
    什么时候能知道: 赛后
    以前的比赛: [A版输入, B版输入, 人工调整版, 融合, 评估, 复盘, 研究实验]
    本场: [评估, 机器人结算, 复盘]
    注意: 本场比分是答案，只能赛后用来打分、结算、复盘；以前比赛的比分是用来估实力的输入

  射门、xG:
    含义: 射门、射正、xG
    来源: 射门、射正 football-data；xG 懂球帝比赛详情页（五大联赛，英超 2025-12-03 起有，其他联赛从哪天起看导入报告；2026-10-31 起接入），football-data 2026/27 起也有 xG。同一场两份都留，取数时这类数据挑填得最全的来源
    有数据的年份: 射门英超 2000/01、其他顶级联赛 2005/06（德甲 2000/01–2001/02 有、2002/03–2005/06 没有、2006/07 起有）、次级联赛 2017/18 起；xG 2025 年 12 月起（2025/26 赛季中途），更早的没有免费可用的来源（见需求文档 6.1 xG 来源调查）
    表: match_stats
    列: [home_shots, away_shots, home_shots_on_target, away_shots_on_target, home_xg, away_xg]
    什么时候能知道: 赛后
    以前的比赛: [A版输入, B版输入, 人工调整版, 评估, 复盘, 研究实验]
    本场: [复盘]
    注意: 本场的射门、xG 赛后才有，只能用来复盘（判断是不是运气型）。不同网站的 xG 模型不同，同一场数字不一样；以后要拼别家的 xG，先标来源或换算

  Understat xG（研究）:
    含义: Understat 的每场 xG、不含点球的 xG（npxG）
    来源: GitHub 上别人 2021 年从 Understat 抓的射门明细镜像（没有许可证，你决定只放本机做研究实验，需求文档 6.1“Understat 射门明细镜像”），src/clean/understat_match.py 按比赛加起来、对上我们的比赛
    有数据的年份: 五大联赛 2014/15–2021/22（2021/22 只到 2021-12-12）
    文件: understat_xg            # 不在数据库里：settings.yaml 的 paths.understat_xg 那个 CSV，按 match_id 接到比赛上
    列前缀: us_                   # 文件里叫 home_xg，取出来叫 us_home_xg（免得和数据库里懂球帝的 home_xg 混在一起）
    列: [us_home_xg, us_away_xg, us_home_npxg, us_away_npxg]
    什么时候能知道: 赛后
    以前的比赛: [研究实验]
    本场: []
    注意: 只能用于研究实验（只在开发模式）。不上线、不进期末考试：上线后没有这个来源，Understat 的 xG 和懂球帝的也不一样

  伤停（研究）:
    含义: 每场开球前 24 小时两队的伤停：伤了几个人、伤的人身价占全队的比例、“最贵 11 人”身价掉了多少、最贵 11 人身价和
    来源: GitHub 上别人从 Transfermarkt 抓的球员数据镜像 salimt/football-datasets（没有许可证，你决定只放本机做研究实验，需求文档 6.1“Transfermarkt 球员数据镜像（salimt）”），src/clean/injury_features.py 算出
    有数据的年份: 五大联赛 2010/11 起（更早的是空值，伤病表早年记得太少）
    文件: injury_features         # 不在数据库里：settings.yaml 的 paths.injury_features 那个 CSV，按 match_id 接到比赛上
    列前缀: tm_                   # 文件里叫 home_inj_n，取出来叫 tm_home_inj_n
    列: [tm_home_inj_n, tm_away_inj_n, tm_home_inj_share, tm_away_inj_share, tm_home_inj_top_loss, tm_away_inj_top_loss, tm_home_top_value, tm_away_top_value]
    什么时候能知道: 快照时间
    以前的比赛: [研究实验]
    本场: [研究实验]
    注意: 只能用于研究实验（只在开发模式）。不上线、不进期末考试：salimt 是事后整理的历史表，上线要另找实时伤停来源（需求文档第 18 节第 8 条）。每场只有开球前 24 小时那一个时间点的情况，截止时间早于那个时间点就是空值

  角球、黄牌:
    含义: 角球、犯规、黄牌、红牌
    来源: football-data
    有数据的年份: 和射门差不多
    表: match_stats
    列: [home_corners, away_corners, home_fouls, away_fouls, home_yellow, away_yellow, home_red, away_red]
    什么时候能知道: 赛后
    以前的比赛: [A版输入, B版输入, 人工调整版, 复盘]
    本场: [复盘]
    模型输入从第几阶段起: 10
    注意: 角球、黄牌第 10 阶段才进模型，现在只存

  半场比分:
    含义: 半场比分
    来源: football-data
    有数据的年份: 1995/96 前后起
    表: match_stats
    列: [ht_home_goals, ht_away_goals]
    什么时候能知道: 赛后
    以前的比赛: [复盘]
    本场: [复盘]
    注意: 不做半场玩法，导入但暂不用；以后要试作特征，先在这里加用途

  裁判:
    含义: 裁判名字（只有英超、英冠）
    来源: football-data
    有数据的年份: 英超、英冠 2000/01 起
    表: match_stats
    列: [referee]
    什么时候能知道: 赛后
    以前的比赛: [显示]
    本场: [显示]
    注意: 先存，暂不用。裁判其实赛前几天公布，但 football-data 是赛后才给的，按赛后算

  赛前赔率:
    含义: 各公司赛前的胜平负、大小球 2.5、亚盘
    来源: football-data（周五下午 / 周二下午采集，离开赛约 1–3 天）
    有数据的年份: 多家平均 2005/06 起；平博 2012/13 起；Bet365 2002/03 起
    表: odds
    条件: timing = 'pre'
    什么时候能知道: 赛前赔率
    以前的比赛: [B版输入, 融合, 评估, 复盘]
    本场: [B版输入, 融合, 机器人下注, 评估, 显示]
    注意: A 版不用赔率作输入（第 4 节），否则就不是“只看比赛数据”的模型，和赔率比较、融合都没有意义

  收盘赔率:
    含义: 各公司开球时的最后一个价格
    来源: football-data
    有数据的年份: 平博 2012/13 起；多家平均 2019/20 起
    表: odds
    条件: timing = 'close'
    什么时候能知道: 收盘
    以前的比赛: [B版输入, 评估, 复盘]
    本场: [评估, 机器人结算, 复盘, 显示]
    注意: 本场的收盘赔率开球时才有，任何版本赛前都拿不到；以前比赛的收盘赔率只给 B 版，A 版不能用

  变盘记录:
    含义: 带时间的盘口、赔率变化
    来源: 懂球帝（2026-10-31 起导入）：每家公司的初盘、最新，加上每小时快照里看到的每个价格
    有数据的年份: 五大联赛 2018/19 起（历史回补中；法甲 2019/20 懂球帝没有）；赛前快照 2026-10-30 起
    表: odds_changes（取数：src/features 的 odds_changes、latest_odds）
    什么时候能知道: 变盘时间
    以前的比赛: [B版输入, 机器人下注, 复盘]
    本场: [B版输入, 融合, 机器人下注, 显示]
    注意: A 版和用 A 版概率的机器人不能用；只能用到预测时点 / 下注时点为止的记录。本场的「融合」是预测页的融合概率里“赔率概率”那一份（2026-11-01 加，需求文档第 5 节“预测页怎么接融合、倾向、信心等级”）

