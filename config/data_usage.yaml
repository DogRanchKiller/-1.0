    本场: [评估, 复盘]
    模型输入从第几阶段起: 8
    注意: 欧战比分第 8 阶段（扩展欧洲杯赛）才进模型；现在只用杯赛的赛程

  新闻标题:
    含义: 新闻条目的来源、标题、链接、发布时间、抓到时间，以及关联的球队 / 比赛（不存正文和图片）
    来源: 本地文件导入（src/clean/news_import.py）。真正抓哪个网站要你决定（需求文档第 18 节第 10 条），现在没有任何登记过的来源
    有数据的年份: 还没有（从开抓那天起积累；以后回补的历史新闻，抓到时间是补抓那一天，赛前用不上）
    表: news_items、news_links（取数：src/features 的 news_for_match）
    什么时候能知道: 抓取时间
    以前的比赛: [复盘, 显示]
    本场: [复盘, 显示]
    注意: 只给你看、复盘用，模型不用（需求文档 7.1）。每行的 known_at_utc = 抓到时间、发布时间里更晚的一个，截止时间早于它就拿不到

  新闻结构化信息:
    含义: 从新闻或你手动录入的“一件事”：主帅更换、核心长期伤缺（哪支球队、哪天生效、涉及的人）
    来源: 本地文件导入（src/clean/news_import.py）；你手动录入走同一个程序
    有数据的年份: 还没有
    表: news_facts（取数：src/features 的 news_facts_for_match）
    什么时候能知道: 抓取时间
    以前的比赛: [A版输入, B版输入, 复盘, 显示]
    本场: [A版输入, B版输入, 复盘, 显示]
    模型输入从第几阶段起: 9
    注意: 每行的 known_at_utc = 来源新闻的抓到时间、发布时间、录入时间里最晚的一个（事后整理旧新闻，整理出来的信息当时并没有，不能用）。没有可以回测的历史，要按需求文档第 5 节“第 4 阶段以后才加的改进”先影子运行，通过才上线

# ---------- 运行模式：每种模式能读哪些赛季（第 17 节“三种运行模式”） ----------
# 赛季用途由 src.common.config.season_role 判断：开发 dev / 期末考试 exam / 上线后 live。
# 每种模式下，每类赛季允许哪些用途；不在列表里的就报错（不是悄悄跳过，免得以为自己用的是全部数据）。
# “全部”= 上面“用途”里的每一个。
运行模式:
  开发:
    说明: 回测、比较模型、调参。期末考试赛季锁住，连“当预测目标”都不行
    dev: 全部
    exam: []
    live: []
  考试:
    说明: 第 4 阶段末考一次。考试赛季可以读、可以打分
    dev: 全部
    exam: 全部
    live: []
  实时:
    说明: 给未来比赛出预测。考试赛季只用来估当前实力，不在上面打分、调参（第 5 节“锁住只针对评分和调参”）
    dev: 全部
    exam: [A版输入, B版输入, 人工调整版, 休息天数和欧战后标签, 显示]
    live: 全部
