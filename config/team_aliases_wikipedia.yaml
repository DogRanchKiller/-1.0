# 维基百科队名对照表（需求文档 6.4、第 17 节“统一标准”）
#
# 维基百科网页里的球队用“条目名”表示（球队链接指向的那篇文章的标题，例如 “Manchester United F.C.”）。
# 这个文件说明哪些条目名是我们的球队（config/teams.yaml 里的球队）。
#
#   对照            teams.yaml 的“英文” → 维基百科条目名（可以有好几个：同一家俱乐部的不同写法、改名、没加链接时的写法）
#   不是我们的球队  名字和我们的球队很像、但确认不是同一家俱乐部的条目名 → 说明。写在这里防止以后误加进“对照”
#
# 不在这两处的条目名都当作“外来球队”（数据库里编号是 wiki:条目名），不会和我们的球队混在一起。
# 导入时还会核对国家：条目名对上了，但国旗（或国内杯赛的国家）和 teams.yaml 的国家不一样，也当外来球队。
#
# 2026-10-31 用程序按名字找候选、再人工逐条检查后生成：
#   - 意大利、西班牙等俱乐部破产重组后用新名字的（例如 Parma Calcio 1913、Bari 1908），football-data 当作同一支球队，
#     这里也对照到同一支。
#   - B 队、二队、青年队、女队都不对照（它们在“不是我们的球队”里，或者根本不会被自动认成一线队）。
#   - 说不清是不是同一家的（俱乐部解散后新建、名字一样），先不对照，列在导入报告的“可能是我们的球队”里，
#     等人确认：Lleida CF、A.S. Andria BAT、Varese Calcio S.S.D.、FC Gütersloh 2000、AS Valence、Perpignan Canet FC。
#   - teams.yaml 里有、但维基百科页面里没找到的：B 队（不参加国王杯）、Merida（1990 年代的 CP Mérida）、
#     Alzano、C. Sangro。
