  "韦*":         {名字: BetVictor, 依据: 核对过, 核对: "253 场一样；韦德（也写作伟德）= Victor Chandler，football-data 早年叫 VC Bet"}
  "立*":         {名字: Ladbrokes, 依据: 核对过, 核对: "250 场一样；立博 = Ladbrokes"}
  "平*":         {名字: 平博 Pinnacle, 依据: 核对过, 核对: "胜平负只有 2017/18–2020/21 有，14 场一样；让球、大小球一直有"}
  "bw**":        {名字: Bet&Win, 依据: 核对过, 核对: "38 场一样（共 65 场）；bwin，football-data 叫 Bet&Win"}
