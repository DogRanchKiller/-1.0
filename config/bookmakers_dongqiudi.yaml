# 懂球帝的公司名 → 我们数据库里的公司名（需求文档 6.3、第 17 节“博彩公司名对照”）。
#
# 懂球帝的公司名大多打了星号（例如“Bet3**”“平*”），星号挡住的字只能推测。
# 能和 football-data 核对的，2026-10-31 用 2019/20 起对上号的比赛核对过：
# 懂球帝“最新”胜平负（开球前的）和 football-data 各公司收盘逐一比，三个赔率都差 ≤ 0.01 算一样，
# 下面“核对”写的是完全一样的场数（和第二像的那家比）。
#   核对过：  两边完全一样的比赛明显最多，确定是同一家
#   推测：    football-data 没有这家，或者场数太少没法核对，按常见公司名推测；以后能核对再改
# 名字和 football-data 一样的用同一个写法（例如 Bet365），这样两个来源的同一家公司能放在一起比。
# 这里没有的公司名：导入时照原样用懂球帝的名字，并列进导入报告的“没对照的公司”。
公司:
