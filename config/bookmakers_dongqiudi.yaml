  "10B**":       {名字: 10BET, 依据: 推测}
  "1xB**":       {名字: 1XBet, 依据: 推测, 核对: "只有让球、大小球，football-data 只有它的胜平负，没法核对"}
  "SN**":        {名字: SNAI, 依据: 推测}
