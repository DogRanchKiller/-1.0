# football-data CSV 的数据字典：每一列一条（需求文档第 17 节“历史数据下载后怎么整理”第 2 步、“怎么保证不用错”）。
#
# 怎么来的：按网站自带的列说明 notes.txt（data/raw/football-data/notes/）的命名规则，对下载到的 333 个 CSV 里
# 出现过的 230 个列名逐个登记；notes.txt 没写到的列，“依据”里写“推断”。2026-10-30 生成后人工检查过，以后手工维护。
# 下载到新的列名时，清点程序（src.clean.football_data_inventory）会报“没登记”，先在这里登记再用。
#
# 每列的字段：
#   含义          这一列是什么
#   类别          第 17 节第 3 步的分类：比赛信息 / 赛果 / 半场比分 / 比赛统计 / 裁判 / 赛前赔率 / 收盘赔率 /
#                 平均 / 最高赔率 / 已关闭公司的赔率 / 投注公司数
#   时点          赛前 / 收盘 / 赛后。防偷看未来最关键的一个字段：
#                   赛后 = 比赛踢完才知道（本场只能当答案）；收盘 = 开球那一刻才知道（本场任何版本都不能用）；
#                   赛前 = 开赛前就知道
#   数据项        把同一种数据的不同列名归到一起，例如 BbAvH（早年）和 AvgH（后来）都是“多家平均 胜平负 赛前”
#   部分          这一列是数据项里的哪一部分：主胜 / 平 / 客胜、大 / 小、主队 / 客队、盘口 等
#   公司          赔率列才有
#   本季还有      2026/27 赛季的文件里还有没有这家公司（赔率列才有）
#   什么时候能拿到 拿到这个数据的时间
#   用途          对应第 17 节“数据用途”表的哪一行（“只存”= 先导入或留在原始文件，暂时没用途）
#   依据          notes.txt 原文，或者“推断”加理由
#   备注          需要特别注意的地方
#
# 注意：亚盘的“盘口”列，早年每家公司有自己的盘口（如 B365AH、GBAH、LBAH），后来是多家通用的 AHh（赛前）和 AHCh（收盘）。
# 赔率列要和对应的盘口列配对才有意义，清洗时按赛季处理。
列:
  HomeTeam: {含义: 主队, 类别: 比赛信息, 时点: 赛前, 数据项: 主客队, 部分: 主队, 什么时候能拿到: 赛前, 用途: 比赛信息, 依据: notes.txt}
